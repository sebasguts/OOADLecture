# Objektorientierte Analyse & Design
## Modul 2: Objektorientierte Analyse (OOA)

---

### Präzise Lernziele

<div class="two-cols">
<div class="col">

Nach aktiver Erarbeitung dieses Moduls können Sie:

1. **Den Zweck der OOA begründen:** Erklären, warum Anforderungsanalyse vor dem Coden zwingend nötig ist und wie sie teure Fehlentwicklungen verhindert.
2. **Lastenheft und Pflichtenheft formal unterscheiden:** Auftraggeber- und Entwicklersicht präzise abgrenzen und die jeweiligen Inhalte und Zielgruppen benennen.
3. **Akteure und Use Cases identifizieren:** Akteure als Rollen (nicht als Personen) modellieren und Anwendungsfälle nach dem Blackbox-Prinzip mit Aktiv-Verben formulieren.

</div>
<div class="col">

<div class="col-card">

#### Weiterführende Entwurfsziele:
4. **Beziehungen fehlerfrei anwenden:** Die Semantik und Pfeilrichtungen von `<<include>>` (zwingend erforderlich) und `<<extend>>` (optional/konditional) sicher einsetzen.
5. **Praxisnahe Szenariotabellen erstellen:** Eine an Cockburn angelehnte Szenariotabelle (9 Felder) mit Vor-/Nachbedingungen, Happy Path, alternativen Pfaden und Fehlerbehandlungen verfassen.
6. **Agile Spezifikation & DDD verstehen:** User Stories in Gherkin-Syntax (BDD) formulieren, Aktivitätsdiagramme zeichnen und Bounded Contexts (DDD) voneinander abgrenzen.
7. **Den Übergang von OOA zu OOD meistern:** Aus Analyse-Ergebnissen mit der Abbott-Methode und der Übergangsmatrix systematisch Klassen, Verantwortlichkeiten und ein fachliches Klassenmodell ableiten.

</div>

</div>
</div>

### Warum scheitern Softwareprojekte?

<div class="two-cols">
<div class="col">

> *"There is nothing quite so useless as doing with great efficiency something that should not be done at all."*  
> (Peter Drucker)

* **Das klassische Missverständnis:**
  * Der Kunde erklärt, was er zu brauchen glaubt.
  * Der Entwickler versteht etwas völlig anderes und programmiert sofort los.
  * Am Ende entspricht das Produkt weder den Wünschen noch den realen Prozessen.
* **Kosten von Fehlern (Faustregel / Größenordnung nach Boehm 1981\*):**
  * Fehler entsteht in Analyse und wird dort behoben: **1 €**.
  * Derselbe Fehler wird erst beim Coden entdeckt: **10 €**.
  * Derselbe Fehler wird erst im Live-Betrieb beim Kunden entdeckt: **100–1000 €**!
  * <small style="color:#64748b;">\*Hinweis: Datenbasis heute methodisch diskutiert; bei agilen/iterativen Zyklen fällt der Faktor geringer aus, die Tendenz bleibt zentral.</small>

</div>
<div class="col">

<div class="col-card">

#### Das Phasenmodell der Softwaretechnik
```
1. Analyse (Anforderungserhebung + OOA)  <- HIER entscheidet sich der Erfolg!
   ↓
2. Objektorientiertes Design (OOD)
   ↓
3. Implementierung (Code)
   ↓
4. Test & Qualitätssicherung
   ↓
5. Wartung & Betrieb
```
**OOA ist die strukturierte Methode der Analysephase: Sie beantwortet das "WAS" (Fachdomäne), noch nicht das "WIE" (Technik).**

</div>

</div>
</div>

### Lastenheft vs. Pflichtenheft

<div class="two-cols">
<div class="col">

#### Das Lastenheft (Auftraggebersicht)
* **Wer schreibt es?** Der Kunde / Auftraggeber.
* **Inhalt:** *Was* soll das System können? Welche fachlichen Ziele werden verfolgt? (Gesamtheit der Forderungen).
* **Sprache:** Reine Fachsprache der Domäne, **kein** technischer Jargon.

#### Das Pflichtenheft (Auftragnehmersicht)
* **Wer schreibt es?** Das Entwicklerteam / der Auftragnehmer (DIN 69901-5 / VDI 2519).
* **Inhalt:** Konkretisierte, prüfbare Anforderungen: *Wie und womit* setzt der Auftragnehmer das Lastenheft um? (Use Cases, Szenarien, UI-Zustände, Qualitätsanforderungen, technische Rahmenbedingungen, Abnahmekriterien).
* **Verbindung zur OOA:** Die OOA liefert wesentliche fachliche Inhalte des Pflichtenhefts!

</div>
<div class="col">

<div class="col-card">

#### Die Alltagsanalogie: *Hausbau*
* **Lastenheft des Bauherrn:**
  * "Ich möchte ein Einfamilienhaus für 4 Personen mit hellem Wohnzimmer, geringem Energieverbrauch und einer Garage."
* **Bau- und Leistungsbeschreibung (Pflichtenheft) des Architekten:**
  * Verbindliche Spezifikation: 142 m² Wohnfläche, KfW-40-Standard, Fußbodenheizung in allen Wohnräumen, Garage 6×3 m, Fertigstellungstermin und Abnahmekriterien. *(Die Statikberechnung und der Elektroschaltplan entsprechen später dem detaillierten Entwurf/Design!)*

</div>

</div>
</div>

### Die Fallstudie: Ada's Botanical Innovations

<div class="two-cols">
<div class="col">

#### Ausgangssituation & Geschäftsmodell:
* **Ada Lovelace** betreibt einen erfolgreichen Fachhandel für exotische Pflanzen, Pflanzgefäße und sensorbasierte Pflegesysteme.
* **Bisheriger Zustand:**
  * Reiner Vor-Ort-Verkauf im Ladengeschäft mit einer einfachen Kasse.
  * Keine Anbindung an ein zentrales Lager- oder Liefersystem.
  * Hoher manueller Aufwand und Dateninkonsistenzen.

#### Die Vision: Die moderne Plattform
Ada beauftragt uns mit der Analyse und dem Entwurf einer integrierten Plattform für **drei Vertriebswege**:
1. 🛒 **B2C-Webshop:** Endkunden bestellen online mit Express-Option.
2. 🏢 **B2B-Portal:** Firmenkunden kaufen auf Rechnung mit Kreditlimit.
3. 💼 **Point-of-Sale (POS):** Ladenpersonal bedient Kunden an der Kasse.

</div>
<div class="col">

<div class="col-card">

#### Kernanforderungen für die Analyse:
* **Vielfältige Akteure:** Endkunden, Geschäftskunden, Kassenpersonal und externe Partnersysteme (Kurier, Payment) spielen zusammen.
* **Getrennte Fachbereiche:**
  * Eine *Pflanze* im Webshop benötigt Fotos und Marketingtexte.
  * Dieselbe *Pflanze* im Lager benötigt Regalplätze und IoT-Sensordaten (Bodenfeuchte zur Pflegeplanung).
* **Defensive Geschäftsregeln:**
  * Express-Lieferung nur bei lokalem Lagerbestand und unter 15 km Distanz.
  * B2B-Kauf auf Rechnung nur bei verifiziertem Kreditlimit.

> **Roter Faden:** Dieses System begleitet uns durch die gesamte Anforderungsanalyse und den Übergang zum Code!

</div>

</div>
</div>

### Akteure (Actors): Rolle vs. Person

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card" style="font-size: 0.9em;">

> Ein **Akteur** ist eine Rolle, die ein Mensch oder Fremdsystem gegenüber dem System einnimmt. **Akteure stehen immer AUSSERHALB des Systems.**

* **Rolle, nicht Person:** „Frau Müller“ oder „Ada“ sind Personen. Akteure sind die Rollen: `Kunde`, `Verkaeufer`, `Geschaeftsfuehrung`.
* **Fremdsysteme:** 💳 Zahlungsdienst (Stripe), 🚚 Kurierdienst, 🌦️ Wetterdienst.

<div style="margin-top: 8px; font-size: 0.88em; border-top: 1px solid #e2e8f0; padding-top: 6px;">

**Rollen bei Ada (alle systemextern):**
* 👤 **Endkunde (`Kd`):** Bestellt im Webshop, zahlt online.
* 🏢 **B2B-Kunde (`Kd_B2B`):** Bestellt auf Rechnung (spezialisiert `Kunde`).
* 💼 **Verkäufer (`Vk`):** Ladenpersonal am POS (unternehmensintern, systemextern).
* 👩‍💼 **Geschäftsführung (`GF`):** Filialleitung (Ada nimmt diese Rolle ein).
* 🤖 **Kurierdienst (`Ku`):** Partnersystem für Eilzustellung.

</div>

</div>

</div>
<div class="col">

```mermaid
flowchart TD
    B2B["🏢 B2B-Kunde"]
    Kunde["👤 Endkunde"]
    Verkaeufer["💼 Verkäufer"]
    GF["👩‍💼 Geschäftsführung"]
    System["🤖 Kurierdienst"]

    B2B -->|erbt von| Kunde
    GF -->|erbt von| Verkaeufer
```

<div style="font-size: 0.74em; color: #64748b; margin-top: 6px;">
<em>UML-Semantik:</em> Generalisierung zeigt vom Speziellen zum Allgemeinen (B2B ▷ Kunde). Akteure stehen immer außerhalb der Systemgrenze.
</div>

</div>
</div>

### Anwendungsfälle (Use Cases): Das Blackbox-Prinzip

<div class="two-cols">
<div class="col">

> Ein **Use Case** beschreibt eine fachlich abgeschlossene Interaktion zwischen einem Akteur und dem System zur Erreichung eines konkreten geschäftlichen Ziels.

#### Die goldenen Regeln für Use Cases:
1. **Das System ist eine Blackbox:**
   * Wir beschreiben, was von außen sichtbar passiert, nicht wie interne Algorithmen rechnen.
2. **Benennungsregel:**
   * Immer aktiv: `[Substantiv im Akkusativ] + [Verb im Infinitiv]`.
   * *Richtig:* "Pflanze verkaufen", "Expresslieferung beauftragen".
   * *Falsch:* "Datenbankzugriff", "Login-System", "Passwort hashen".

</div>
<div class="col">

<div class="col-card">

#### Typische Anfängerfehler:
* ❌ **Funktionszerlegung:** "Klick auf Button", "Validierung von Feld 3" sind keine Use Cases, sondern Bedienschritte!
* ❌ **Interne Technik als Use Case:** "SQL-Backup durchführen" ist kein fachlicher Anwendungsfall der Pflanzenplattform.
* ✅ **Der Test:** Hat der Akteur nach Abschluss des Use Cases einen echten fachlichen Mehrwert erhalten?

</div>

</div>
</div>

### Beziehung 1: `«include»` (Zwingend erforderlich)

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

> Eine **`«include»`**-Beziehung bedeutet, dass der Basisfall das Verhalten eines anderen Use Cases **zwingend vollständig einbindet**. Ohne den inkludierten Fall kann der Basisfall nicht erfolgreich abschließen.

* **Wann nutzen?**
  * Um gemeinsame Teilabläufe auszulagern, die in mehreren Use Cases identisch vorkommen (Wiederverwendung).
  * Beispiel: Sowohl *"Pflanzen online bestellen"* als auch *"Pflanzen im Laden kaufen"* schließen *"Zahlung abwickeln"* zwingend ein.
  * **Analogie:** *"Geld abheben"* schließt *"PIN prüfen"* ein. Ohne PIN-Prüfung gibt es nie Bargeld!
  * **Direkter Aufruf durch Akteure:** Ein inkludierter Use Case kann auch eigenständig von einem Akteur gestartet werden (z. B. *"Zahlung abwickeln"* zum Begleichen einer Monatsrechnung).
* **Pfeilrichtung:**  
  Vom Basisfall **hin** zum inkludierten Fall:  
  `Basisfall -.->|include| InkludierterFall`

</div>

</div>
<div class="col">

```mermaid
flowchart TD
    UC_Order(["Pflanzen online bestellen"])
    UC_BuyStore(["Pflanzen im Laden kaufen"])
    UC_Pay(["Zahlung abwickeln"])

    UC_Order -.->|include| UC_Pay
    UC_BuyStore -.->|include| UC_Pay
```

</div>
</div>

### Beziehung 2: `«extend»` (Optional / Bedingt)

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

> Eine **`«extend»`**-Beziehung erweitert das Verhalten eines Basisfalls **nur unter bestimmten Bedingungen** an einem definierten *Extension Point*. Der Basisfall ist auch ohne die Erweiterung vollständig funktionsfähig!

* **Wann nutzen?**
  * Für rein optionale Zusätze, Sonderbehandlungen oder seltene Ausnahmen.
  * Beispiel: Beim Blumenkauf kann der Kunde *optional* eine handschriftliche Grußkarte beilegen lassen oder Expresslieferung wählen.
* **Extension Points & Conditions (UML 2.5):**
  * Im Basisfall wird eine Andockstelle definiert: `extension points: Lieferoptionen`.
  * Am Extend-Pfeil hängt die Auslösebedingung: `condition: {Kunde wünscht Grußkarte}`.
  * *(Hinweis: Verschiedene Werkzeuge wie PlantUML, Enterprise Architect oder Visio nutzen eigene Notationen für Conditions; in Diagrammen beschriftet man den Pfeil pragmatisch mit Sterotyp und Bedingung).*
* **Pfeilrichtung (Achtung, häufiger Denkfehler!):**  
  Der Pfeil zeigt **von der optionalen Erweiterung ZUR Basis**:  
  `Erweiterung -.->|extend| Basisfall`

</div>

</div>
<div class="col">

```mermaid
flowchart TD
    UC_Order(["Bestellung aufgeben<br><small><i>extension points:</i> Lieferoptionen</small>"])
    UC_Gift(["Grußkarte beilegen"])
    UC_Express(["Expresszuschlag buchen"])

    UC_Gift -.->|"extend<br>[condition: {Grußkarte erwünscht}]"| UC_Order
    UC_Express -.->|"extend<br>[condition: {Express gewählt}]"| UC_Order
```

</div>
</div>

### `<<include>>` vs. `<<extend>>`: Der direkte Vergleich

<div class="two-cols">
<div class="col">

<div class="col-card">

#### `<<include>>` (Zwingend)
* **Ausführung:** Läuft **immer** ab, wenn der Basisfall läuft.
* **Basisfall vollständig?** Nein, dem Basisfall fehlt ohne das Include ein unverzichtbarer Baustein.
* **Pfeilrichtung:**  
  `Basis  ----->  Include`
* **Alltagsanalogie:**  
  *"Geld abheben"* schließt *"PIN prüfen"* ein. Ohne PIN gibt es kein Geld!

</div>

</div>
<div class="col">

<div class="col-card">

#### `<<extend>>` (Optional)
* **Ausführung:** Läuft **nur unter Bedingungen** ab (Extension Point).
* **Basisfall vollständig?** Ja! Der Basisfall funktioniert auch ohne die Erweiterung autark.
* **Pfeilrichtung:**  
  `Erweiterung  ----->  Basis`
* **Alltagsanalogie:**  
  *"Sitzheizung einschalten"* erweitert *"Autofahren"*. Man kann problemlos fahren, ohne sie je einzuschalten!

</div>

</div>
</div>

### Großes Use-Case-Diagramm: Das Gesamtsystem bei Ada

<div class="two-cols-wide-left">
<div class="col">

```mermaid
flowchart LR
    Kunde["👤 Endkunde"]
    B2B["🏢 B2B-Kunde"]
    Verkaeufer["💼 Verkäufer"]
    Kurier["🤖 Kurierdienst"]
    PaySys["💳 Zahlungsdienst"]

    subgraph System["Ada's Botanical Platform"]
        UC_Order(["Pflanzen online bestellen"])
        UC_BuyStore(["Pflanzen im Laden kaufen"])
        UC_Pay(["Zahlungsart autorisieren"])
        UC_Gift(["Grußkarte beilegen"])
        UC_Express(["Expresslieferung buchen"])
    end

    Kunde --- UC_Order
    B2B --- UC_Order
    Verkaeufer --- UC_BuyStore

    %% Inclusions (zwingend)
    UC_Order -.->|include| UC_Pay
    UC_BuyStore -.->|include| UC_Pay

    %% Extensions (optional)
    UC_Gift -.->|extend| UC_Order
    UC_Express -.->|extend| UC_Order

    %% Sekundärakteure (ungerichtete Assoziationen)
    UC_Express --- Kurier
    UC_Pay --- PaySys
```

</div>
<div class="col">

<div class="col-card">

#### Das Zusammenspiel im Überblick:
* **Linie (`---`) = Assoziation:** Verbindet Akteure mit Use Cases (wer beteiligt ist). Gestrichelte Pfeile (`-.->`) sind Beziehungen zwischen Use Cases (`«include»`/`«extend»`).
* **`«include»` (Zwingend erforderlich):**  
  * *"Pflanzen online bestellen"* und *"Pflanzen im Laden kaufen"* binden beide *"Zahlungsart autorisieren"* ein (deckt Sofortzahlung und B2B-Rechnungskauf ab).
* **`«extend»` (Optional / Bedingt):**  
  * *"Grußkarte beilegen"* und *"Expresslieferung buchen"* erweitern die Bestellung nur auf Kundenwunsch.
* **Sekundärakteure:** Externe Partner wie `Kurierdienst` und `Zahlungsdienst` unterstützen die Ausführung.

### Die Szenario-Tabelle: Das Fundament der OOA

<div class="two-cols">
<div class="col">

<div class="col-card">

Ein Use-Case-Diagramm ist nur das **Inhaltsverzeichnis**.  
**Die eigentliche Analysearbeit steckt in der Szenario-Tabelle!**

* Ein Diagramm zeigt nur: *"Wer interagiert mit welchem Fall?"*
* Die Szenario-Tabelle spezifiziert das **konkrete Verhalten**:
  * Welche Vorbedingungen müssen zwingend erfüllt sein?
  * Was garantiert das System nach erfolgreichem Abschluss?
  * Welche Schrittfolge läuft im Erfolgsfall ab?
  * Wie reagiert das System auf Ausnahmen und Fehler?

In Anlehnung an Alistair Cockburns *Fully-Dressed*-Template nutzen wir in dieser Vorlesung eine **didaktisch reduzierte Struktur mit 9 Feldern** (Fokus auf Vor-/Nachbedingungen, Ablauf, Alternativen und Fehler).

</div>

</div>
<div class="col">

<div class="col-card">

#### Die 9 Felder unserer Szenariotabelle:
1. **Name des Use Case & ID** (Aktiv-Formulierung)
2. **Kurzbeschreibung** (Kernzweck in 1–2 Sätzen)
3. **Beteiligte Akteure & Kürzel** (Primär- & Sekundärakteure)
4. **Vorbedingungen** (Preconditions – vorab gesicherte Zustände)
5. **Nachbedingungen** (Postconditions / Erfolgsgarantien)
6. **Auslöser / Trigger** (Start-Ereignis des Anwenders)
7. **Standardszenario** (Happy Path: Schritte 1 bis n)
8. **Alternative Pfade** (Verzweigungen zum erfolgreichen Ziel)
9. **Fehlersituationen / Ausnahmen** (Abbrüche & Kompensation)
*(Optional: 10. Offene Punkte / Fachfragen)*

</div>

</div>
</div>

---

### Szenariotabelle: Felder 1 & 2 (Name & Kurzbeschreibung)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 1: Eindeutiger Name
* **Zweck:** Das zentrale Identifikationsmerkmal im Pflichtenheft, Code und Ticketsystem.
* **Regel:** Immer im Aktiv formulieren:  
  `[Substantiv im Akkusativ] + [Verb im Infinitiv]`.
* ❌ *Schlecht:* `FastDeliveryService`, `DB_Insert_Order`
* ✅ *Gut:* `Expresslieferung beauftragen (2h)`

**Praxisbeispiel bei Ada:**
> **1. Name:** `Expresslieferung beauftragen (2h)`

</div>

</div>
<div class="col">

<div class="col-card">

#### Feld 2: Kurzbeschreibung
* **Zweck:** Bringt den geschäftlichen Kernzweck und den Nutzen für den Akteur auf den Punkt (1–2 Sätze).
* **Regel:** Keine technischen Details (wie SQL, HTTP, JSON). Rein fachliche Sprache!
* **Prüffrage:** Versteht ein Laie oder der Auftraggeber sofort das Ziel?

**Praxisbeispiel bei Ada:**
> **2. Kurzbeschreibung:**  
> *"Ein Kunde bestellt Pflanzen zur sofortigen Auslieferung durch einen Stadtkurier innerhalb von maximal 2 Stunden nach Bestelleingang."*

</div>

</div>
</div>

---

### Szenariotabelle: Felder 3 & 4 (Akteure & Vorbedingungen)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 3: Beteiligte Akteure & Kürzel
* **Primärer Akteur:** Initiiert den Fall und hat das primäre Ziel (`Kd` = Kunde).
* **Sekundäre Akteure:** Werden vom System eingebunden (`Ku` = Kurier, `Pay` = Zahlungsdienst).
* **System-Kürzel:** `Sys` = Unsere Softwareplattform.

<div style="background: #f8fafc; border-left: 4px solid var(--primary, #2980b9); padding: 10px 14px; margin-top: 10px; border-radius: 0 6px 6px 0;">
<strong>3. Praxisbeispiel Akteure:</strong>
<ul style="margin: 6px 0 0 18px; padding: 0;">
    <li><code>Kd</code> (Kunde, primär)</li>
    <li><code>Ku</code> (Kurierdienst, sekundär)</li>
    <li><code>Pay</code> (Zahlungsdienstleister, sekundär)</li>
    <li><code>Sys</code> (Ada's Botanical Platform)</li>
</ul>
</div>

</div>

</div>
<div class="col">

<div class="col-card">

#### Feld 4: Vorbedingungen (Preconditions)
* **Zweck:** Harte Wächter! Vorbedingungen sind Zustände, die das System **bereits sichergestellt hat** (keine Annahmen über den zukünftigen Verlauf).
* **Regel:** Rein fachliche Sprache (kein Code!). Was im Ablauf scheitern kann, wird im Ablauf geprüft (Schritt &amp; Extension).

<div style="background: #f8fafc; border-left: 4px solid var(--primary, #2980b9); padding: 10px 14px; margin-top: 10px; border-radius: 0 6px 6px 0;">
<strong>4. Praxisbeispiel Vorbedingungen:</strong>
<ol style="margin: 6px 0 0 18px; padding: 0;">
    <li>Kunde ist im System angemeldet.</li>
    <li>Warenkorb enthält mindestens eine lieferbare Pflanze.</li>
</ol>
<div style="font-size: 0.8em; color: #64748b; margin-top: 4px;"><em>(Lieferadresse im Radius und freie Kuriere werden in Schritt 2 geprüft!)</em></div>
</div>

</div>

</div>
</div>

---

### Szenariotabelle: Felder 5 & 6 (Nachbedingungen & Trigger)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 5: Nachbedingungen (Garantien)
* **Zweck:** Welcher dauerhafte Zustand ist nach erfolgreichem Abschluss **garantiert**?
* **Regel:** Gilt für den erfolgreichen Abschluss (Happy Path / alternative Pfade).
* **Minimalgarantie (Cockburn):** Was gilt selbst im Fehlerfall? (z. B. *"Konto des Kunden wird nie belastet, ohne dass ein Kurier zugesagt hat"*).

**Praxisbeispiel bei Ada:**
> **5. Nachbedingungen:**  
> 1. Bestellung ist verbindlich erfasst und Zahlung ist gesichert (eingezogen oder B2B-Kreditlimit belastet).  
> 2. Ware ist im Stadtlager für den Kurier reserviert.  
> 3. Kurier hat den Fahrauftrag verbindlich bestätigt.  
> 4. Kunde hat Bestätigung mit Live-Tracking-Link erhalten.

</div>

</div>
<div class="col">

<div class="col-card">

#### Feld 6: Auslöser (Trigger)
* **Zweck:** Das konkrete Anfangsereignis, das den Use Case anstößt.
* **Wichtig:** Unterschied zur Vorbedingung:  
  * *Vorbedingung:* Zustand (*"Kunde ist angemeldet"*).  
  * *Trigger:* Ereignis / Absicht (*"Kunde wünscht Expresszustellung"*).
* *Kein UI-Detail:* Cockburn rät: *„Keep the user interface out.“* Nicht Button-Klicks spezifizieren, sondern die geschäftliche Aktion!

**Praxisbeispiel bei Ada:**
> **6. Auslöser (Trigger):**  
> Kunde wählt im Checkout Expresszustellung per Kurier.

</div>

</div>
</div>

---

### Szenariotabelle: Feld 7 (Das Standardszenario / Happy Path)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 7: Der Happy Path
* Die lineare Schrittfolge, wenn **alles optimal läuft** (keine Fehler, keine Ausnahmen).
* **Formatierung:** Nummerierte Liste (1 bis n).
* **Jeder Schritt nennt:**  
  `[Nummer]. [Akteurskürzel] [präzise, beobachtbare Aktion]`.
* Keine `if/else`-Verzweigungen im Happy Path!

</div>

</div>
<div class="col">

<div class="col-card">

#### Schrittfolge bei Ada's Expresslieferung:
1. `Kd` wählt Expresslieferung und gibt Lieferadresse an.
2. `Sys` prüft Lieferradius (≤ 15 km), Kurierverfügbarkeit und reserviert Bestand für 10 Min.
3. `Sys` berechnet Gesamtpreis inkl. 5,90 € Expresszuschlag.
4. `Kd` bestätigt Gesamtsumme und autorisiert die Zahlung.
5. `Sys` übermittelt Fahrauftrag an `Ku`.
6. `Ku` bestätigt Annahme des Fahrauftrags innerhalb von 3 Minuten.
7. `Sys` bucht den autorisierten Betrag verbindlich ab.
8. `Sys` generiert Tracking-Link und sendet Bestätigung an `Kd`.

</div>

</div>
</div>

---

### Szenariotabelle: Felder 8 & 9 (Alternative Pfade & Fehler)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 8: Alternative Pfade (Extensions)
* **Zweck:** Abweichende, aber **erfolgreiche** Abläufe.
* **Nummerierung:** Schrittnummer aus dem Happy Path + Buchstabe (`4a`, `6a`).

**Praxisbeispiel bei Ada:**
* **4a. B2B-Rechnungskauf:**  
  Ist `Kd` als B2B-Kunde verifiziert und Kreditlimit ausreichend ⇒ `Sys` belastet Kreditlimit statt Sofortzahlung; Zahlungsziel 14 Tage auf Rechnung.
* **6a. Kurierverzögerung:**  
  Bestätigt `Ku` nicht in 3 Min ⇒ `Sys` delegiert Auftrag automatisch an den nächsten verfügbaren Kurier.

</div>

</div>
<div class="col">

<div class="col-card">

#### Feld 9: Fehlersituationen / Ausnahmen
* **Zweck:** Was passiert bei Abbrüchen, ungültigen Daten oder Partnerausfällen?
* **Wichtig:** Wie räumt das System auf (Rollback &amp; Kompensation)?

**Praxisbeispiel bei Ada:**
* **2a. Außerhalb Liefergebiet:**  
  Distanz > 15 km ⇒ `Sys` lehnt Express ab, bietet Standard-Paketversand an.
* **2b. Kein Kurier / Bestand erschöpft:**  
  Kein Kurier verfügbar ⇒ `Sys` informiert Kunden und bietet Standardversand an.
* **4b. Autorisierung abgelehnt:**  
  Zahlungsmittel scheitert ⇒ `Sys` fordert neue Zahlungsart an; Bestandsreservierung verfällt nach 10 Minuten.
* **6b. Kein Kurier nimmt an:**  
  Nach Eskalation kein Kurier gefunden ⇒ `Sys` gibt Zahlungsautorisierung und Bestandsreservierung frei, informiert `Kd`, bietet Standardversand an.

</div>

</div>
</div>

### Von der Szenariotabelle zu User Stories &amp; BDD

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Warum jetzt User Stories &amp; BDD?
* **Die Szenariotabelle nach Cockburn** ist mächtig und vollständig – aber im agilen Sprint-Alltag oft zu schwergewichtig.
* **Agile Teams (Scrum / Kanban)** schneiden Funktionalität in kleine, testbare Inkremente: **User Stories**.
* **BDD (Behavior-Driven Development)** schlägt die Brücke:  
  Es übersetzt die Szenariotabelle in **ausführbare Akzeptanzkriterien** (Gherkin-Syntax), die Fachexperte und Test-Runner gleichermaßen verstehen!

</div>

</div>
<div class="col">

<div class="col-card">

#### Der direkte Vergleich: Wo liegt der Unterschied?
| Aspekt | Cockburn-Szenariotabelle | User Story + BDD (Gherkin) |
|---|---|---|
| **Zweck** | Vollständige Spezifikation des gesamten Use Case | Kleines, sprintfertiges Feature-Inkrement |
| **Umfang** | Happy Path + alle Alternativen + alle Fehler in 1 Tabelle | 1 Story mit 2–4 konkreten Einzelszenarien |
| **Format** | Tabellarische 9 Felder (PDF / Wiki) | `Given - When - Then` im Text-File (`.feature`) |
| **Testbarkeit** | Manuelle Abnahmegrundlage | **Direkt automatisierbar** via `pytest-bdd` |

</div>

</div>
</div>

---

### Agile Spezifikation: User Stories & BDD

<div class="two-cols">
<div class="col">

In agilen Teams (Scrum/Kanban) formulieren wir den Geschäftswert als **User Story**:

> **Als** `[Rolle / Akteur]`  
> **möchte ich** `[Ziel / Funktionalität]`,  
> **damit** `[fachlicher Nutzen / Mehrwert]`.

* Fördert das Verständnis: Entwickler verstehen **warum** ein Feature gebaut wird!
* Eine User Story wird erst durch messbare **Akzeptanzkriterien** überprüfbar.
* **BDD (Behavior-Driven Development):** Schreibt Akzeptanztests in lesbarer Gherkin-Syntax.
* Jedes Einzelszenario entspricht einem Pfad aus der Szenariotabelle (Happy Path oder Exception!).

</div>
<div class="col">

```gherkin
# language: de
Funktionalität: B2B Express-Kauf auf Rechnung
  Als verifizierter B2B-Kunde von Ada
  Möchte ich Pflanzen per Express auf Rechnung bestellen
  Damit die Bürobegrünung ohne Kreditkartenabrechnung ankommt

  Szenario: Erfolgreicher Kauf bei ausreichendem Kreditlimit
    Angenommen Kunde "GreenOffice GmbH" ist als B2B verifiziert
    Und das verbleibende Kreditlimit beträgt 1.000 €
    Wenn der Kunde Pflanzen im Wert von 350 € per Express bestellt
    Dann wird die Bestellung sofort bestätigt
    Und das neue Kreditlimit beträgt 650 €
    Und ein Fahrauftrag wird erstellt (Zustellgarantie innerhalb von 2 Stunden)

  Szenario: Ablehnung bei Überschreitung des Limits
    Angenommen Kunde "StartUp AG" hat ein Restkreditlimit von 50 €
    Wenn der Kunde Pflanzen im Wert von 120 € auf Rechnung bestellt
    Dann wird der Rechnungskauf abgewiesen
    Und es wird eine Sofortzahlung (Kreditkarte/PayPal) verlangt
```

</div>
</div>

### BDD & Gherkin: Syntax & Warum es sich lohnt

<div class="two-cols">
<div class="col">

#### Die kanonische Gherkin-Struktur:
Gherkin folgt dem Dreischritt **Given – When – Then** (bzw. **Angenommen – Wenn – Dann**):

* **`Given` / `Angenommen` (Ausgangslage):**  
  Beschreibt den Zustand und die Vorbedingungen des Systems, bevor die Aktion startet (z. B. *"Kunde ist verifiziert, Kreditlimit beträgt 1.000 €"*).
* **`When` / `Wenn` (Aktion):**  
  Das auslösende Ereignis oder die Benutzerinteraktion (z. B. *"Kunde bestellt Pflanzen im Wert von 350 €"*).
* **`Then` / `Dann` (Erwartetes Ergebnis):**  
  Das beobachtbare, überprüfbare Resultat (z. B. *"Bestellung wird bestätigt, neues Limit ist 650 €"*).
* **`And` / `Und` & `But` / `Aber`:**  
  Verbindet logisch weitere Vor- oder Nachbedingungen.

</div>
<div class="col">

<div class="col-card">

#### Warum ist BDD & Gherkin so wertvoll?
1. **Gemeinsame Sprache (Ubiquitous Language):**  
   Schließt die Kluft zwischen Fachexperten (Ada), Product Ownern, Entwicklern und Testern – ganz ohne technischen Jargon.
2. **Ausführbare Spezifikation (Executable Specs):**  
   Mit Frameworks (`pytest-bdd`, `behave`, `Cucumber`) wird genau dieser Text **automatisiert als Testsuite ausgeführt**!
3. **Living Documentation:**  
   Die Dokumentation verstaubt nicht in PDFs: Laufen Code und Spezifikation auseinander, schlägt der Test in CI/CD sofort fehl.
4. **Klärt Randfälle vor dem Coden:**  
   Zwingt das Team dazu, negative Pfade (*"Was passiert bei 0 € Limit?"*) vor der ersten Codezeile festzulegen.

</div>

</div>
</div>

### Warum UI schon in der Analyse? Das gemeinsame mentale Modell

<div class="two-cols">
<div class="col">

<div class="col-card">

#### 1. Text allein erzeugt Missverständnisse
* Auftraggeber wie Chefin Ada lesen seitenlange Szenariotabellen oft flüchtig:  
  *„Ja, klingt vernünftig!“*
* Erst wenn Kunden einen **visuellen Screen (Mockup / Wireframe)** sehen, verstehen sie die Konsequenzen:
  * *„Ach so, der Kunde muss seine Postleitzahl eingeben, bevor er den Preis sieht?“*
* **UI als Verstehens-Werkzeug:**  
  Screens machen abstrakte Geschäftsprozesse für Fachexperten und Stakeholder greifbar.

</div>

</div>
<div class="col">

<div class="col-card">

#### 2. UI als Erweiterung der Szenariotabelle
* Jeder Screen ist die **visuelle Ausprägung unserer Szenarien**:
  * **Happy Path** → Normalzustand der Oberfläche (alle Daten gültig, Klick möglich).
  * **Vorbedingungen &amp; Fehler** → Alternative Oberflächenzustände.
* **Warum direkt defensiv gestalten?**  
  Wer die Fehlerfälle der Szenariotabelle kennt, baut die UI so, dass der Anwender gar nicht erst in die Falle tappen kann (*Poka-Yoke*)!

</div>

</div>
</div>

---

### Defensive UI: Fehler im Keim ersticken

<div class="two-cols">
<div class="col">

<div class="col-card">

> *"Gutes Softwaredesign macht Fehlbedienung schwer bis unmöglich."*  
> (Angelehnt an **Poka-Yoke** / Shigeo Shingo &amp; Don Norman)

#### Defensive UI-Prinzipien im Pflichtenheft:
* **Deaktivieren UND begründen:**  
  Ist eine Option nicht wählbar, wird der Button **deaktiviert** und mit Tooltip/Badge erklärt (z. B. *"Ausverkauft"* oder *"Außerhalb Liefergebiet"*).
* **Sofortige Inline-Validierung:**  
  Postleitzahlen und Lieferadressen werden direkt bei der Eingabe geprüft, nicht erst nach Absenden des gesamten Formulars.
* **Sicherheits-Grundsatz:**  
  ⚠️ **Defensive UI dient der Usability, ersetzt aber keine Backend-Validierung!** Jede Geschäftsregel muss zwingend im Backend (Guard Clauses / Domänenlogik) erzwungen werden, da UI-Beschränkungen (z. B. per DevTools/API) umgangen werden können.

</div>

</div>
<div class="col">

<div class="col-card">

#### Pflichtbestandteile der UI-Spezifikation:
1. **Mockup / Wireframe:** Visuelle Skizze der Oberfläche mit allen Zuständen.
2. **Feldtabelle:** Name, Datentyp, Pflichtfeld (Ja/Nein), Validierungsregel.
3. **Zustandsmatrix:** Wann ist welches Element aktiv (`enabled`), inaktiv (`disabled`) oder unsichtbar (`hidden`)?

**Zustandsmatrix für Ada's Express-Kauf:**
* `Bestand > 0 && Distanz ≤ 15 km` ⇒ Button `[Express (2h)]` aktiv.
* `Bestand == 0` ⇒ Button deaktiviert + Badge: *"Ausverkauft"*.
* `Distanz > 15 km` ⇒ Express deaktiviert + Begründung *"Außerhalb Liefergebiet"*.

</div>

</div>
</div>

### Ablaufmodellierung: Aktivitätsdiagramme

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

Aktivitätsdiagramme visualisieren **Abläufe, Verzweigungen und Nebenläufigkeit**:

* `●` **Startknoten:** Wo beginnt der Prozess?
* `[Aktion]` **Aktion:** Eine durchgeführte Tätigkeit (`[Ware verpacken]`).
* `<Entscheidung>` **Raute:** Verzweigung mit **Guards** `[Bedingung]` an den ausgehenden Kanten.
* `===` **Synchronisationsbalken:** Fork (Aufspaltung in parallele Fäden) und Join (Synchronisation).
* `◎` **Endknoten:** Wo endet der Prozess?

</div>

</div>
<div class="col">

```mermaid
flowchart TD
    Start([Start]) --> CheckStock[Lagerbestand & Kurier pruefen]
    CheckStock --> D1{ }
    D1 -->|"[Bestand OK & im Radius]"| Reserve[Ware reservieren]
    D1 -->|"[nicht lieferbar]"| Abort[Standardversand anbieten]
    Abort --> EndeFail([Ende: Abbruch / Standard])

    Reserve --> AuthPay[Zahlung autorisieren]
    AuthPay --> D2{ }
    D2 -->|"[Autorisierung fehlgeschlagen]"| Release[Reservierung freigeben]
    Release --> EndeFail

    D2 -->|"[Zahlung autorisiert]"| Fork["=== FORK (Parallel) ==="]
    Fork --> Pack[Ware im Lager verpacken]
    Fork --> Dispatch[Kurier anfragen & disponieren]
    Pack --> Join["=== JOIN (Synchronisation) ==="]
    Dispatch --> Join

    Join --> Charge[Zahlung einziehen & Tracking senden]
    Charge --> EndeSuccess([Ende: Expresslieferung gestartet])
```

<div style="font-size: 0.72em; color: #64748b; margin-top: 6px;">
<em>Hinweis:</em> In UML 2.5 sind Fork/Join solide Balken; Rauten enthalten keine Fragen, sondern Bedingungen stehen in eckigen Klammern (Guards).
</div>

</div>
</div>

### Bounded Contexts (Domain-Driven Design)

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

Warum scheitert die Idee einer einzigen, riesigen `Pflanze`-Klasse für das gesamte Unternehmen?

* **Im Webshop (Verkauf):**  
  Wichtig sind: Hochauflösendes Foto, Marketingtext, Bruttopreis, Kundenbewertungen.
* **Im Lager (Inventory):**  
  Wichtig sind: Barcode, Regal- und Fachnummer, Mindestbestand, Pflegesensordaten.
* **In der Logistik (Kurier):**  
  Wichtig sind: Gewicht in kg, Paket-Maße &amp; Schutzbedarf gegen Frost/Kippen.

> Die Analyse identifiziert **fachliche Teilbereiche (Subdomänen im Problemraum)**. Im Entwurf schneiden wir dafür **Bounded Contexts (Lösungsraum)** mit je eigener einheitlicher Fachsprache (**Ubiquitous Language**)!

</div>

</div>
<div class="col">

```mermaid
flowchart TD
    subgraph Verkauf["Context: Webshop & Verkauf"]
        V_Pflanze["Pflanze<br><small>(Foto, Text, Preis)</small>"]
        Bestellung["Bestellung"]
        V_Pflanze --- Bestellung
    end
    subgraph Lager["Context: Lager & Bestand"]
        L_Pflanze["Pflanze<br><small>(Lagerplatz, Sensor, Bestand)</small>"]
    end
    subgraph Logistik["Context: Auslieferung"]
        Log_Pflanze["Pflanze<br><small>(Paket-Maße, Gewicht)</small>"]
    end

    Verkauf -->|Ereignis: BestellungBezahlt| Lager
    Lager -->|Ereignis: WareKommissioniert| Logistik
```

<div style="font-size: 0.72em; color: #64748b; margin-top: 6px;">
<em>DDD-Regel:</em> Bounded Contexts greifen nicht direkt auf fremde Tabellen/Klassen zu, sondern kommunizieren über lose gekoppelte Domain Events oder Schnittstellen.
</div>

</div>
</div>

### Der Übergang: Vom Problemraum (OOA) zum Lösungsraum (OOD)

<div class="two-cols">
<div class="col">

Nachdem wir Akteure, Use Cases, Szenarien und Bounded Contexts analysiert haben, stehen viele Entwickler vor der Frage:  
**Wie fange ich jetzt an zu programmieren?**

#### 1. Die OOA beschreibt den Problemraum:
* **Fokus:** Das **"WAS"** (Fachdomäne, Fachbegriffe, Geschäftsregeln).
* **Zielgruppe:** Kunde, Fachexperten, Anwender.
* **Sprache:** Reine Domänensprache (z. B. "Pflanze", "Kreditlimit", "Kurier").
* **Technik:** Völlig frei von Implementierungsdetails (kein SQL, kein JSON, kein Python)!

</div>
<div class="col">

<div class="col-card">

#### 2. Das OOD entwirft den Lösungsraum:
* **Fokus:** Das **"WIE"** (Softwarearchitektur, Klassen, Schnittstellen, Datenstrukturen).
* **Zielgruppe:** Entwickler, Architekten, Tester.
* **Sprache:** Technische Spezifikation (z. B. `OrderService`, `PostgresRepository`, `JWT`, `REST`).
* **Zuweisung von Verantwortung (Responsibility-Driven Design):**  
  Welche Klasse speichert die Daten? Welche führt die Geschäftslogik aus? Welche kommuniziert mit der Außenwelt?

</div>

</div>
</div>

### Die Abbott-Methode (Substantiv-Verb-Analyse)

<div class="two-cols">
<div class="col">

Eine bewährte Technik von Russell J. Abbott (1983) zur systematischen Ableitung von Objektmodellen aus Anforderungstexten und Szenariotabellen:

#### Die grammatikalische Übersetzungsmatrix:
* **Eigennamen → Konkrete Objekte / Instanzen:**  
  *"Frau Müller"*, *"Filiale Berlin"* → Instanzen (`kunde_1 = Kunde(...)`).
* **Gattungsnamen (Substantive) → Klassen / Typen oder Attribute:**  
  * Mit eigener Identität &amp; Lebenszyklus → **Entity** (`Kunde`, `Bestellung`).
  * Messbare Ausprägung / ohne Identität → **Value Object** (`Geldbetrag`, `Adresse`) oder **Attribut** (`menge`).
* **Vollverben → Methoden &amp; Operationen (Kandidaten):**  
  Aktionen oder Statusänderungen (`reservieren()`, `berechne_summe()`).
* **Haben-Verben ("besitzt", "enthält") → Assoziation / Komposition:**  
  `Bestellung` *enthält* `BestellPositionen`.
* **Sein-Verben ("ist eine Art von") → Vererbung:**  
  `B2BKunde` *ist ein* `Kunde`. *(Achtung: "ist + Adjektiv", z. B. "ist aktiv", wird zum Status/Enum, nicht zur Vererbung!)*

</div>
<div class="col">

<div class="col-card">

#### Grundbeispiel: Webshop-Bestellung
> *"Der **Kunde** wählt eine **Pflanze** aus und legt sie in den **Warenkorb**. Er **bestätigt** die **Bestellung** mit einer **Zahlungsart**. Das System **reserviert** den **Bestand** und **beauftragt** einen **Kurier**."*

#### Ableitung in den Entwurf:
* **Klassenkandidaten &amp; Value Objects:**  
  `Kunde` (Entity), `Pflanze` (Entity), `Warenkorb` (Entity), `Bestellung` (Entity), `Geldbetrag` (Value Object), `Kurier` (Entity).
* **Verantwortungszuweisung:**  
  Abbott liefert **Kandidaten**. Wer welche Methode erhält, entscheidet im nächsten Schritt das *Information-Expert*-Prinzip (oder eine *Pure Fabrication* für serviceseitige Koordination).
  * `Warenkorb.fuege_hinzu(pflanze, menge)`
  * `BestellAbwicklungService.fuehre_aus(...)` *(Pure Fabrication)*

</div>

</div>
</div>

### Abbott-Methode Praxis: 1. Ladenkasse (POS-Verkauf)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Anforderungstext:
> *"Der **Verkäufer** **scannt** den **Barcode** der Pflanze. Die **Kasse** **berechnet** den **Gesamtbetrag**, **verbucht** die **Barzahlung** und **druckt** den **Kassenbon**."*

#### Abbott-Klassifikation:
* **Entities:** `Kasse`, `Kassenbon` (Identität &amp; Zustand).
* **Value Object:** `Geldbetrag` *(niemals `float` für Geld!)*, `Barcode`.
* **Methoden (Kasse):**  
  * `scanne_artikel(barcode: Barcode)`
  * `berechne_summe() -> Geldbetrag`
  * `buche_barzahlung(betrag: Geldbetrag)`
* **Pure Fabrication (GRASP):**  
  `BonDrucker.drucke(kassenbon)` (technisches Gerät entkoppelt).

</div>

</div>
<div class="col">

```mermaid
classDiagram
    class Kasse {
        -kassen_id : str
        +scanne_artikel(barcode : str)
        +berechne_summe() Geldbetrag
        +buche_barzahlung(betrag : Geldbetrag)
    }
    class Kassenbon {
        -bon_nr : str
        -zeitstempel : str
    }
    class Geldbetrag {
        <<Value Object>>
        -cent : int
        -waehrung : str
    }
    class BonDrucker {
        <<Service>>
        +drucke(bon : Kassenbon)
    }

    Kasse ..> Kassenbon : erzeugt
    Kasse ..> Geldbetrag : nutzt
    BonDrucker ..> Kassenbon : druckt
```

</div>
</div>

### Abbott-Methode Praxis: 2. B2B-Kauf auf Rechnung

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Anforderungstext:
> *"Ein **B2B-Kunde** **besitzt** ein **Kreditlimit**. Wenn er auf Rechnung **bestellt**, **prüft** das System die **Deckung** und **belastet** das Limit."*

#### Abbott-Klassifikation:
* **Generalisierung (ist ein):** `B2BKunde` spezialisiert `Kunde`.
* **Haben-Beziehung (Attribut):** `B2BKunde` hat ein `kreditlimit: Geldbetrag`.
* **Methodenzuweisung (Information Expert):**  
  * `B2BKunde.hat_ausreichend_deckung(betrag: Geldbetrag) -> bool`
  * `B2BKunde.belaste_limit(betrag: Geldbetrag)`
  *(Die Prüfung liegt direkt beim Kunden, nicht in einem externen Prüfer!)*

</div>

</div>
<div class="col">

```mermaid
classDiagram
    class Kunde {
        -kunde_id : str
        -name : str
        -email : str
    }
    class B2BKunde {
        -kreditlimit : Geldbetrag
        -verbrauchtes_limit : Geldbetrag
        +hat_ausreichend_deckung(betrag : Geldbetrag) bool
        +belaste_limit(betrag : Geldbetrag)
    }
    class Geldbetrag {
        <<Value Object>>
        -cent : int
        -waehrung : str
    }

    Kunde <|-- B2BKunde : ist ein
    B2BKunde ..> Geldbetrag : nutzt
```

</div>
</div>

### Abbott-Methode Praxis: 3. IoT-Pflanzenpflege &amp; Lager

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Anforderungstext:
> *"Ein **BodenSensor** **misst** stündlich die **Bodenfeuchte** einer Topfpflanze. Wenn der Wert den **Grenzwert** **unterschreitet**, **alarmiert** das System den Gärtner."*

#### Abbott-Klassifikation:
* **Entities:** `BodenSensor`, `TopfPflanze`.
* **Attribute &amp; Messwerte:** `feuchte_prozent: float`, `min_grenzwert: float`.
* **Methoden:**  
  * `BodenSensor.lese_feuchte() -> float`
  * `TopfPflanze.pruefe_feuchte_alarm() -> bool`

<div style="margin-top: 8px; font-size: 0.85em; border-top: 1px solid #e2e8f0; padding-top: 6px;">
<strong>Didaktischer Praxistipp (Entity vs. Value Object):</strong><br>
• <strong>Entity:</strong> Eindeutige ID &amp; veränderlicher Zustand (<code>Kunde</code>, <code>Pflanze</code>).<br>
• <strong>Value Object:</strong> Wertgleichheit, unveränderlich (<code>Geldbetrag</code>, <code>Adresse</code>).
</div>

</div>

</div>
<div class="col">

```mermaid
classDiagram
    class BodenSensor {
        -sensor_id : str
        -batteriestand : int
        +lese_feuchte() float
    }
    class TopfPflanze {
        -pflanzen_id : str
        -art_name : str
        -min_bodenfeuchte : float
        +pruefe_feuchte_alarm(aktueller_wert : float) bool
    }
    class AlarmService {
        <<Service>>
        +sende_giess_alarm(pflanze : TopfPflanze)
    }

    TopfPflanze "1" o-- "1" BodenSensor : besitzt
    AlarmService ..> TopfPflanze : benachrichtigt fuer
```

### Responsibility-Driven Design: Vom Szenarioschritt zur Methode

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

#### Das Leitprinzip: Information Expert (GRASP)
* **Die zentrale Entwurfsfrage:**  
  *Welche Klasse soll eine bestimmte Methode / Verantwortung erhalten?*
* **Die goldene Regel:**  
  Weise die Verantwortung der Klasse zu, die über die **notwendigen Daten verfügt**, um sie zu erfüllen!

#### Ableitung aus Alternativpfad 4a der Szenariotabelle:
> *"Pfad 4a: Das System prüft das Kreditlimit des B2B-Kunden..."*

* **Falscher Entwurf (Anfängerfalle):**  
  Eine externe Klasse holt mit Gettern alle Zahlen und rechnet selbst:  
  `if kunde.get_limit() - kunde.get_verbrauch() >= betrag: ...`  
  ❌ Zerstört Datenkapselung (*Feature Envy*)!
* **Besserer Entwurf (Information Expert):**  
  `B2BKunde` kennt sein eigenes Limit und prüft selbst:  
  `kunde.hat_ausreichend_deckung(betrag) -> bool`  
  ✅ Saubere Kapselung von Zustand und Verhalten!

</div>

</div>
<div class="col">

<div class="col-card">

#### Koordination durch Controller / Application Services:
* Eine Fach-Entität (`B2BKunde`) verwaltet nur ihre **eigenen Daten**.
* Wer steuert aber den **Gesamtablauf** über mehrere Entitäten hinweg?  
  *(GRASP nennt dieses Muster **Controller**, in DDD heißt es **Application Service**).*

```mermaid
flowchart TD
    Service["BestellAbwicklungService<br>(Application Service)"]
    Kunde["B2BKunde<br>(Information Expert: Limit)"]
    Lager["Lagerbestand<br>(Information Expert: Bestand)"]
    
    Service -->|"1. hat_ausreichend_deckung"| Kunde
    Service -->|"2. reserviere_bestand"| Lager
```

* Der Service besitzt **keinen eigenen Domänenzustand**, sondern orchestriert die Fachklassen!

</div>

</div>
</div>

### Das fachliche Domänenmodell &amp; Klassenentwurf für Ada
 
<div class="two-cols-wide-left">
<div class="col">

```mermaid
classDiagram
    class Kunde {
        -kunde_id : str
        -name : str
        -email : str
    }

    class B2BKunde {
        -kreditlimit : Geldbetrag
        -verbrauchtes_limit : Geldbetrag
        +hat_ausreichend_deckung(betrag : Geldbetrag) bool
        +belaste_limit(betrag : Geldbetrag)
    }

    class Bestellung {
        -bestell_nr : str
        -datum : date
        -status : BestellStatus
        +berechne_gesamtsumme() Geldbetrag
    }

    class BestellPosition {
        -menge : int
        -einzelpreis : Geldbetrag
        +berechne_zeilensumme() Geldbetrag
    }

    class Pflanze {
        -art_id : str
        -botanischer_name : str
        -katalog_preis : Geldbetrag
    }

    class Geldbetrag {
        <<Value Object>>
        -cent : int
        -waehrung : str
        +plus(anderer) Geldbetrag
    }

    Kunde <|-- B2BKunde : ist ein
    Kunde "1" -- "0..*" Bestellung : gibt auf
    Bestellung "1" *-- "1..*" BestellPosition : besteht aus
    BestellPosition --> Pflanze : referenziert
    BestellPosition ..> Geldbetrag : nutzt
    Pflanze ..> Geldbetrag : nutzt
```

</div>
<div class="col">

<div class="col-card">

#### Fachliche Struktur &amp; Aha-Momente:
1. **Assoziation Kunde–Bestellung:**  
   Jede Bestellung ist genau einem Kunden zugeordnet (`1` zu `0..*`).
2. **Entity vs. Value Object:**  
   `Geldbetrag` ist ein unveränderliches Werteobjekt (`int cent` verhindert Rundungsfehler von binary floats!).
3. **Preise einfrieren (Aha-Moment!):**  
   `BestellPosition.einzelpreis` friert den Preis beim Kauf ein – ändert sich später `Pflanze.katalog_preis`, bleibt die Rechnung unverändert!
4. **Vom Analyse- zum Designmodell:**  
   In der reinen OOA erfassen wir Konzepte und Beziehungen. Methoden und Kapselung (`-`) entstehen beim Übergang zum OOD (Information Expert).

</div>

</div>
</div>

### Die kanonische OOA-zu-OOD-Übergangsmatrix

<div class="two-cols" style="grid-template-columns: 1.35fr 0.85fr; gap: 20px;">
<div class="col" style="font-size: 0.72em;">

Die folgende Matrix dient als **Leitfaden für den gesamten Übergang** von den Analyse-Ergebnissen zur technischen Architektur:

| OOA-Artefakt (Analyse) | OOD-Artefakt (Design) | Konkretes Beispiel bei Ada |
| :--- | :--- | :--- |
| **Akteur** | Client, Auth-Rolle, API-Consumer | `Verkaeufer` → POS-App / JWT-Rolle |
| **Use Case** | Application Service / Interactor | `Pflanzen online bestellen` → `OrderService` |
| **Szenario-Schritt** | Methodenaufruf, Domänenoperation | Schritt 7 → `zahlung.einziehen(betrag)` |
| **Vorbedingung** | Guard Clause / Validator | `Kunde angemeldet` → `if not kunde.ist_verifiziert: raise ...` |
| **Nachbedingung** | Transaktionsgrenze / Test-Assertion | `Bestand reserviert` → Transaktions-Commit |
| **Fehlerpfad** | Domänen-Exception → API-Response | `Limit überschritten` → `KreditlimitUeberschrittenError` → HTTP 422 |
| **Bounded Context** | Modul, Package, Microservice | `Lager vs. Webshop` → getrennte Pakete |

</div>
<div class="col">

<div class="col-card">

#### Die 3 goldenen Regeln für den Übergang:
1. **Kein Code ohne Analyse:** Wer ohne Szenariotabelle programmiert, vergisst systematisch Randbedingungen und Fehlerfälle.
2. **Klassen spiegeln die Domäne wider:** Namen im Code müssen den Begriffen entsprechen, die Chefin Ada im Laden verwendet (*Ubiquitous Language*).
3. **Klare Schnittstellen:** Services kommunizieren über definierte Interfaces, nicht über globale Variablen oder geteilten Speicher.

</div>

</div>
</div>

### Zusammenfassung Modul 2

<div class="two-cols">
<div class="col">

1. **OOA klärt das "WAS":** Verhindert das teure Bauen falscher Software durch sauberes Anforderungsmanagement.
2. **Lastenheft vs. Pflichtenheft:** Der Kunde beschreibt den fachlichen Wunsch, das Pflichtenheft konkretisiert verbindliche, prüfbare Anforderungen und Rahmenbedingungen.
3. **Akteure sind Rollen:** Sie stehen außerhalb des Systems (Menschen oder Fremdsysteme, keine Einzelpersonen!).
4. **Use Cases sind Blackboxen:** Formuliert im Aktiv (`[Substantiv] + [Verb]`).
5. **`<<include>>` vs. `<<extend>>`:** Include läuft zwingend mit, Extend nur bedingt am Extension Point.

</div>
<div class="col">

6. **Die Szenariotabelle ist das Herzstück:** 9 Felder nach Cockburn; der Happy Path allein reicht für die Praxis niemals aus!
7. **User Stories & BDD:** Schlagen die Brücke zur agilen Entwicklung mit ausführbaren Gherkin-Szenarien.
8. **Defensive UI & Subdomänen (DDD):** Fehler im Keim ersticken; jeder Bounded Context besitzt sein eigenes fachliches Modell.
9. **Systematischer Übergang zu OOD:** Abbott liefert Klassenkandidaten, Information Expert verteilt die Verantwortung, und die Matrix übersetzt Analyseartefakte in Code.

</div>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'neutral',
            fontFamily: '"Inter", system-ui, sans-serif'
        });
        async function renderSlideMermaid(slide) {
            if (!slide) return;
            // 1. Convert any code containing mermaid class to div.mermaid
            slide.querySelectorAll('code[class*="mermaid"]').forEach((el) => {
                const pre = el.closest('pre');
                if (pre) {
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    let text = el.textContent || '';
                    text = text.replace(/--&gt;/g, '-->')
                               .replace(/&gt;/g, '>')
                               .replace(/&lt;/g, '<')
                               .replace(/&amp;/g, '&')
                               .replace(/&quot;/g, '"');
                    div.textContent = text.trim();
                    pre.replaceWith(div);
                }
            });

            // 2. Also clean up any div.mermaid written directly in HTML
            slide.querySelectorAll('.mermaid:not([data-processed="true"])').forEach((el) => {
                let text = el.textContent || '';
                text = text.replace(/--&gt;/g, '-->')
                           .replace(/&gt;/g, '>')
                           .replace(/&lt;/g, '<')
                           .replace(/&amp;/g, '&')
                           .replace(/&quot;/g, '"');
                el.textContent = text.trim();
            });

            // 3. Render all unrendered div.mermaid in this active slide
            const nodes = slide.querySelectorAll('.mermaid:not([data-processed="true"])');
            if (nodes.length > 0) {
                try {
                    await mermaid.run({ nodes: nodes, suppressErrors: false });
                } catch (err) {
                    console.error('Mermaid run error:', err);
                }
            }
        }

        Reveal.initialize({
            width: 1280,
            height: 720,
            margin: 0.05,
            minScale: 0.2,
            maxScale: 2.0,
            hash: true,
            slideNumber: 'c/t',
            transition: 'slide',
            plugins: [ RevealMarkdown, RevealHighlight ]
        }).then(() => {
            renderSlideMermaid(Reveal.getCurrentSlide());
        });

        Reveal.on('slidechanged', (event) => {
            renderSlideMermaid(event.currentSlide);
        });
    </script>
