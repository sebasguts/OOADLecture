# Objektorientierte Analyse & Design
## Modul 2: Objektorientierte Analyse (OOA)

---

### Präzise Lernziele

<div class="two-cols">
<div class="col">

Nach aktiver Erarbeitung dieses Moduls können Sie:

1. **Den Zweck der OOA begründen:** Erklären, warum Anforderungsanalyse vor dem Coden zwingend nötig ist und wie sie teure Fehlentwicklungen verhindert.
2. **Lastenheft und Pflichtenheft formal unterscheiden:** Auftraggeber- und Entwicklersicht präzise abgrenzen und die jeweiligen Inhalte und Zielgruppen benennen.
3. **Akteure und Use Cases identifizieren:** Akteure als Rollen (nicht als Personen) modellieren und Anwendungsfälle nach dem Blackbox-Prinzip mit Aktiv-Verben formulieren.

</div>
<div class="col">

<div class="col-card">

4. **Beziehungen fehlerfrei anwenden:** Die Semantik und Pfeilrichtungen von `<<include>>` (zwingend erforderlich) und `<<extend>>` (optional/konditional) sicher einsetzen.

6. **Agile Spezifikation & DDD verstehen:** User Stories in Gherkin-Syntax (BDD) formulieren, Aktivitätsdiagramme zeichnen und Bounded Contexts (DDD) voneinander abgrenzen.
7. **Den Übergang von OOA zu OOD meistern:** Aus Analyse-Ergebnissen mit der Abbott-Methode und der Übergangsmatrix systematisch Klassen, Methoden und Modulgrenzen ableiten.

### Warum scheitern Softwareprojekte?

<div class="two-cols">
<div class="col">

> *"There is nothing quite so useless as doing with great efficiency something that should not be done at all."*  
> (Peter Drucker)

* **Das klassische Missverständnis:**
  * Der Kunde erklärt, was er zu brauchen glaubt.
  * Der Entwickler versteht etwas völlig anderes und programmiert sofort los.
  * Am Ende entspricht das Produkt weder den Wünschen noch den realen Prozessen.
* **Kosten von Fehlern:**
  * Ein Fehler, der in der Analyse behoben wird: **1 €**.
  * Derselbe Fehler beim Coden: **10 €**.
  * Derselbe Fehler im Live-Betrieb beim Kunden: **100–1000 €**!

</div>
<div class="col">

<div class="col-card">

#### Das Phasenmodell der Softwaretechnik
```
1. Anforderungsanalyse  <- HIER entscheidet sich der Erfolg!
   ↓
2. Objektorientierte Analyse (OOA)
   ↓
3. Objektorientiertes Design (OOD)
   ↓
4. Implementierung (Code)
   ↓
5. Test & Qualitätssicherung
   ↓
6. Wartung & Betrieb
```
**OOA beantwortet das "WAS" (Fachdomäne), noch nicht das "WIE" (Technik).**

</div>

</div>
</div>

### Lastenheft vs. Pflichtenheft

<div class="two-cols">
<div class="col">

#### Das Lastenheft (Auftraggebersicht)
* **Wer schreibt es?** Der Kunde / Auftraggeber.
* **Inhalt:** *Was* soll das System können? Welche fachlichen Ziele werden verfolgt?
* **Sprache:** Reine Fachsprache der Domäne, **kein** technischer Jargon.

#### Das Pflichtenheft (Auftragnehmersicht)
* **Wer schreibt es?** Das Entwicklerteam / der Auftragnehmer.
* **Inhalt:** *Wie* wird die Anforderung technisch gelöst? (Architektur, Datenmodelle, Schnittstellen, UI-Entwürfe).
* **Sprache:** Technisch präzise, verbindliche Vertragsgrundlage!

</div>
<div class="col">

<div class="col-card">

#### Die Alltagsanalogie: *Hausbau*
* **Lastenheft des Bauherrn:**
  * "Ich möchte ein Einfamilienhaus für 4 Personen mit hellem Wohnzimmer, geringem Energieverbrauch und einer Garage."
* **Pflichtenheft des Architekten:**
  * Statik-Berechnungen, Grundriss mit Wandstärken in cm, Verlegeplan für Fußbodenheizung, Elektroschaltplan und Baustoffliste.

</div>

</div>
</div>

### Die Fallstudie: Ada's Botanical Innovations

<div class="two-cols">
<div class="col">

#### Ausgangssituation & Geschäftsmodell:
* **Ada Lovelace** betreibt einen erfolgreichen Fachhandel für exotische Pflanzen, Pflanzgefäße und sensorbasierte Pflegesysteme.
* **Bisheriger Zustand:**
  * Reiner Vor-Ort-Verkauf im Ladengeschäft mit einer einfachen Kasse.
  * Keine Anbindung an ein zentrales Lager- oder Liefersystem.
  * Hoher manueller Aufwand und Dateninkonsistenzen.

#### Die Vision: Die moderne Plattform
Ada beauftragt uns mit der Analyse und dem Entwurf einer integrierten Plattform für **drei Vertriebswege**:
1. 🛒 **B2C-Webshop:** Endkunden bestellen online mit Express-Option.
2. 🏢 **B2B-Portal:** Firmenkunden kaufen auf Rechnung mit Kreditlimit.
3. 💼 **Point-of-Sale (POS):** Ladenpersonal bedient Kunden an der Kasse.

</div>
<div class="col">

<div class="col-card">

#### Kernanforderungen für die Analyse:
* **Vielfältige Akteure:** Endkunden, Geschäftskunden, Kassenpersonal und externe Dienstleister (Kurier, Payment) müssen harmonisch zusammenspielen.
* **Getrennte Fachbereiche:**
  * Eine *Pflanze* im Webshop benötigt Fotos und Marketingtexte.
  * Dieselbe *Pflanze* im Lager benötigt Regalplätze und IoT-Sensordaten.
* **Defensive Geschäftsregeln:**
  * Express-Lieferung nur bei lokalem Lagerbestand und unter 15 km Distanz.
  * B2B-Kauf auf Rechnung nur bei verifiziertem Kreditlimit.

> **Roter Faden:** Dieses System begleitet uns durch die gesamte Anforderungsanalyse und den Übergang zum Code!

</div>

</div>
</div>

### Akteure (Actors): Rolle vs. Person

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

> Ein **Akteur** stellt eine Rolle dar, die ein Anwender oder ein externes Fremdsystem gegenüber unserer Software einnimmt.

* **Akteure stehen immer AUSSERHALB des Systems.**
* **Rolle, nicht Person:**
  * "Frau Müller" ist kein Akteur. Die Rolle `Kunde` oder `Verkäufer` ist der Akteur!
  * Eine Person kann morgens als `Kunde` einkaufen und nachmittags als `Verkäufer` an der Kasse stehen.
* **Auch Fremdsysteme sind vollwertige Akteure:**
  * 💳 Zahlungsdienstleister (PayPal, Stripe)
  * 🚚 Kurierdienst-API (Stadtkurier)
  * 🌦️ Wetterdienst-API (Bewässerungsprognosen)

<div style="margin-top: 10px; font-size: 0.82em; border-top: 1px solid #e2e8f0; padding-top: 8px;">

**Die Rollen bei Ada im Überblick:**  
* 👤 **Endkunde (`Kd`):** Bestellt im Webshop, zahlt online.
* 🏢 **B2B-Kunde (`Kd_B2B`):** Spezialisierter Großkunde, bestellt auf Rechnung.
* 💼 **Verkäufer (`Vk`):** Ladenpersonal, bedient die POS-Kasse im Geschäft.
* 👩‍💼 **Chefin Ada (`Adm`):** Geschäftsführung, prüft Bestände und Freigaben.
* 🤖 **Kurierdienst (`Ku`):** Externes REST-API-Partnersystem.

</div>

</div>

</div>
<div class="col">

```mermaid
flowchart TD
    Akteur["[Rolle] Akteur"]
    Kunde["Kunde (extern)"]
    Verkaeufer["Verkäufer (intern)"]
    System["Kurier-API (Fremdsystem)"]
    B2B["B2B-Kunde"]
    Ada["Chefin Ada"]

    Akteur --> Kunde
    Akteur --> Verkaeufer
    Akteur --> System
    Kunde -->|Spezialisierung| B2B
    Verkaeufer -->|Spezialisierung| Ada
```

</div>

### Anwendungsfälle (Use Cases): Das Blackbox-Prinzip

<div class="two-cols">
<div class="col">

> Ein **Use Case** beschreibt eine fachlich abgeschlossene Interaktion zwischen einem Akteur und dem System zur Erreichung eines konkreten geschäftlichen Ziels.

#### Die goldenen Regeln für Use Cases:
1. **Das System ist eine Blackbox:**
   * Wir beschreiben, was von außen sichtbar passiert, nicht wie interne Algorithmen rechnen.
2. **Benennungsregel:**
   * Immer aktiv: `[Substantiv im Akkusativ] + [Verb im Infinitiv]`.
   * *Richtig:* "Pflanze verkaufen", "Expresslieferung beauftragen".
   * *Falsch:* "Datenbankzugriff", "Login-System", "Passwort hashen".

</div>
<div class="col">

<div class="col-card">

#### Typische Anfängerfehler:
* ❌ **Funktionszerlegung:** "Klick auf Button", "Validierung von Feld 3" sind keine Use Cases, sondern Bedienschritte!
* ❌ **Interne Technik als Use Case:** "SQL-Backup durchführen" ist kein fachlicher Anwendungsfall der Pflanzenplattform.
* ✅ **Der Test:** Hat der Akteur nach Abschluss des Use Cases einen echten fachlichen Mehrwert erhalten?

</div>

</div>
</div>

### Beziehung 1: `«include»` (Zwingend erforderlich)

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

> Eine **`«include»`**-Beziehung bedeutet, dass der Basisfall das Verhalten eines anderen Use Cases **zwingend vollständig einbindet**. Ohne den inkludierten Fall kann der Basisfall nicht erfolgreich abschließen.

* **Wann nutzen?**
  * Um gemeinsame Teilabläufe auszulagern, die in mehreren Use Cases identisch vorkommen.
  * Beispiel: Sowohl *"Online bestellen"* als auch *"Im Laden kaufen"* schließen die *"Zahlung abwickeln"* zwingend ein.
  * **Direkter Aufruf durch Akteure:** Ein inkludierter Use Case kann oft auch eigenständig von einem Akteur gestartet werden (z. B. wenn *"Zahlung abwickeln"* auch separat zum Begleichen einer offenen Monatsrechnung aufgerufen werden darf).
* **Pfeilrichtung:**  
  Vom Basisfall **hin** zum inkludierten Fall:  
  `Basisfall -.->|include| InkludierterFall`

</div>

</div>
<div class="col">

```mermaid
flowchart TD
    UC_Order(["Online bestellen"])
    UC_BuyStore(["Im Laden kaufen"])
    UC_Pay(["Zahlung abwickeln"])

    UC_Order -.->|include| UC_Pay
    UC_BuyStore -.->|include| UC_Pay
```

</div>
</div>

---

### Beziehung 2: `«extend»` (Optional / Bedingt)

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

> Eine **`«extend»`**-Beziehung erweitert das Verhalten eines Basisfalls **nur unter bestimmten Bedingungen** an einem definierten *Extension Point*. Der Basisfall ist auch ohne die Erweiterung vollständig funktionsfähig!

* **Wann nutzen?**
  * Für rein optionale Zusätze, Sonderbehandlungen oder seltene Ausnahmen.
  * Beispiel: Beim Blumenkauf kann der Kunde *optional* eine handschriftliche Grußkarte beilegen lassen oder Expresslieferung wählen.
* **Pfeilrichtung (Achtung, häufiger Denkfehler!):**  
  Der Pfeil zeigt **von der optionalen Erweiterung ZUR Basis**:  
  `Erweiterung -.->|extend| Basisfall`

</div>

</div>
<div class="col">

```mermaid
flowchart TD
    UC_Order(["Bestellung aufgeben"])
    UC_Gift(["Grußkarte beilegen"])
    UC_Express(["Expresszuschlag buchen"])

    UC_Gift -.->|extend| UC_Order
    UC_Express -.->|extend| UC_Order
```

</div>
</div>

---

### `<<include>>` vs. `<<extend>>`: Der direkte Vergleich

<div class="two-cols">
<div class="col">

<div class="col-card">

#### `<<include>>` (Zwingend)
* **Ausführung:** Läuft **immer** ab, wenn der Basisfall läuft.
* **Basisfall vollständig?** Nein, dem Basisfall fehlt ohne das Include ein unverzichtbarer Baustein.
* **Pfeilrichtung:**  
  `Basis  ----->  Include`
* **Alltagsanalogie:**  
  "Autofahren" schließt "Tanken/Laden" ein. Ohne Energie fährt das Auto nicht!

</div>

</div>
<div class="col">

<div class="col-card">

#### `<<extend>>` (Optional)
* **Ausführung:** Läuft **nur unter Bedingungen** ab (Extension Point).
* **Basisfall vollständig?** Ja! Der Basisfall funktioniert auch ohne die Erweiterung perfekt.
* **Pfeilrichtung:**  
  `Erweiterung  ----->  Basis`
* **Alltagsanalogie:**  
  "Sitzheizung einschalten" erweitert "Autofahren". Man kann problemlos fahren, ohne sie je einzuschalten!

</div>

</div>
</div>

### Großes Use-Case-Diagramm: Das Gesamtsystem bei Ada

<div class="two-cols-wide-left">
<div class="col">

```mermaid
flowchart LR
    Kunde["👤 Endkunde"]
    B2B["🏢 B2B-Kunde"]
    Verkaeufer["💼 Verkäufer"]
    Kurier["🚚 Kurierdienst"]

    subgraph System["Ada's Botanical Platform"]
        UC_Order(["Bestellung aufgeben"])
        UC_BuyStore(["Im Laden einkaufen"])
        UC_Pay(["Zahlung abwickeln"])
        UC_CheckStock(["Lagerbestand prüfen"])
        UC_Gift(["Grußkarte beilegen"])
        UC_Express(["Expresslieferung buchen"])
    end

    Kunde --> UC_Order
    B2B --> UC_Order
    Verkaeufer --> UC_BuyStore

    %% Inclusions (zwingend)
    UC_Order -.->|include| UC_CheckStock
    UC_Order -.->|include| UC_Pay
    UC_BuyStore -.->|include| UC_Pay

    %% Extensions (optional)
    UC_Gift -.->|extend| UC_Order
    UC_Express -.->|extend| UC_Order

    %% Direkte Trigger
    Kurier --> UC_Express
    Kunde -.->|Rechnung zahlen| UC_Pay
```

</div>
<div class="col">

<div class="col-card">

#### Das Zusammenspiel im Überblick:
* **`«include»` (Zwingend erforderlich):**  
  * *"Bestellung aufgeben"* und *"Im Laden einkaufen"* binden beide *"Zahlung abwickeln"* ein.
  * Ohne Bestandsprüfung und Zahlung kann kein Kauf erfolgreich abschließen.
* **`«extend»` (Optional / Bedingt):**  
  * *"Grußkarte beilegen"* erweitert die Bestellung nur auf Kundenwunsch.
  * *"Expresslieferung buchen"* greift nur, wenn Eilzustellung ausgewählt wird.
* **Teilabläufe direkt getriggert:**  
  * *"Zahlung abwickeln"* kann auch direkt vom Kunden aufgerufen werden (z. B. Ausgleich offener Rechnungen).

</div>

</div>
</div>

### Die Szenario-Tabelle: Das Fundament der OOA

<div class="two-cols">
<div class="col">

<div class="col-card">

Ein Use-Case-Diagramm ist nur das **Inhaltsverzeichnis**.  
**Die eigentliche Analysearbeit steckt in der Szenario-Tabelle!**

* Ein Diagramm zeigt nur: *"Wer interagiert mit welchem Fall?"*
* Die Szenario-Tabelle spezifiziert das **konkrete Verhalten**:
  * Welche Vorbedingungen müssen zwingend erfüllt sein?
  * Was garantiert das System nach erfolgreichem Abschluss?
  * Welche Schrittfolge läuft im Erfolgsfall ab?
  * Wie reagiert das System auf Ausnahmen und Fehler?

Nach Alistair Cockburn besitzt eine professionelle Szenariotabelle genau **9 kanonische Abschnitte**.

</div>

</div>
<div class="col">

<div class="col-card">

#### Die 9 Pflichtfelder im Überblick:
1. **Name des Use Case** (Aktiv-Formulierung)
2. **Kurzbeschreibung** (Kernzweck in 1–2 Sätzen)
3. **Beteiligte Akteure & Kürzel** (Primär & Sekundär)
4. **Vorbedingungen** (Preconditions – harte Wächter)
5. **Nachbedingungen** (Postconditions – Garantien)
6. **Auslöser / Trigger** (Start-Ereignis)
7. **Standardszenario** (Happy Path: Schritte 1 bis n)
8. **Alternative Pfade** (Erfolgreiche Verzweigungen)
9. **Fehlersituationen / Ausnahmen** (Abbrüche & Rollbacks)

</div>

</div>
</div>

---

### Szenariotabelle: Felder 1 & 2 (Name & Kurzbeschreibung)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 1: Eindeutiger Name
* **Zweck:** Das zentrale Identifikationsmerkmal im Pflichtenheft, Code und Ticketsystem.
* **Regel:** Immer im Aktiv formulieren:  
  `[Substantiv im Akkusativ] + [Verb im Infinitiv]`.
* ❌ *Schlecht:* `FastDeliveryService`, `DB_Insert_Order`
* ✅ *Gut:* `Expresslieferung beauftragen (2h)`

**Praxisbeispiel bei Ada:**
> **1. Name:** `Expresslieferung per Kurier (2h)`

</div>

</div>
<div class="col">

<div class="col-card">

#### Feld 2: Kurzbeschreibung
* **Zweck:** Bringt den geschäftlichen Kernzweck und den Nutzen für den Akteur auf den Punkt (1–2 Sätze).
* **Regel:** Keine technischen Details (wie SQL, HTTP, JSON). Rein fachliche Sprache!
* **Prüffrage:** Versteht ein Laie oder der Auftraggeber sofort das Ziel?

**Praxisbeispiel bei Ada:**
> **2. Kurzbeschreibung:**  
> *"Ein Kunde bestellt Pflanzen zur sofortigen Auslieferung durch einen Stadtkurier innerhalb von maximal 2 Stunden nach Bestelleingang."*

</div>

</div>
</div>

---

### Szenariotabelle: Felder 3 & 4 (Akteure & Vorbedingungen)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 3: Beteiligte Akteure & Kürzel
* **Primärer Akteur:** Initiiert den Fall und hat das primäre Ziel (`Kd` = Kunde).
* **Sekundäre Akteure:** Werden vom System eingebunden (`Ku` = Kurier, `Pay` = Zahlungsdienst).
* **System-Kürzel:** `Sys` = Unsere Softwareplattform.

**Praxisbeispiel bei Ada:**
> **3. Akteure:**  
> * `Kd` (Kunde, primär)  
> * `Ku` (Kurierdienst, sekundär)  
> * `Sys` (Ada's Botanical Platform)

</div>

</div>
<div class="col">

<div class="col-card">

#### Feld 4: Vorbedingungen (Preconditions)
* **Zweck:** Harte Wächter! Nur wenn **alle** Vorbedingungen wahr sind, darf der Fall starten.
* **Regel:** Müssen vorab prüfbar sein (keine Annahmen über den zukünftigen Verlauf).

**Praxisbeispiel bei Ada:**
> **4. Vorbedingungen:**  
> 1. Kunde ist authentifiziert und eingeloggt (`Kd.is_authenticated == True`).  
> 2. Lieferadresse liegt im Stadtgebiet (Radius ≤ 15 km).  
> 3. Mindestens ein Kurier ist im System aktiv gemeldet und dienstbereit.

</div>

</div>
</div>

---

### Szenariotabelle: Felder 5 & 6 (Nachbedingungen & Trigger)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 5: Nachbedingungen (Garantien)
* **Zweck:** Welcher dauerhafte System- und Realwelt-Zustand ist nach erfolgreichem Abschluss **garantiert**?
* **Regel:** Gilt nur für den erfolgreichen Abschluss (Happy Path / alternative Pfade).

**Praxisbeispiel bei Ada:**
> **5. Nachbedingungen:**  
> 1. Bestellung ist als bezahlt markiert und im ERP verbucht.  
> 2. Ware ist im Lager physisch für den Kurier reserviert.  
> 3. Kurier hat den Fahrauftrag digital bestätigt.  
> 4. Kunde hat Bestätigung mit Live-Tracking-Link erhalten.

</div>

</div>
<div class="col">

<div class="col-card">

#### Feld 6: Auslöser (Trigger)
* **Zweck:** Das konkrete Anfangsereignis, das den Use Case anstößt.
* **Wichtig:** Unterschied zur Vorbedingung:  
  * *Vorbedingung:* Zustand (*"Kunde ist eingeloggt"*).  
  * *Trigger:* Ereignis (*"Kunde klickt Button"*).

**Praxisbeispiel bei Ada:**
> **6. Auslöser (Trigger):**  
> Kunde klickt im Warenkorb auf die Option:  
> `[ ⚡ Express-Lieferung buchen (2h) ]`.

</div>

</div>
</div>

---

### Szenariotabelle: Feld 7 (Das Standardszenario / Happy Path)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 7: Der Happy Path
* Die lineare Schrittfolge, wenn **alles optimal läuft** (keine Fehler, keine Ausnahmen).
* **Formatierung:** Nummerierte Liste (1 bis n).
* **Jeder Schritt nennt:**  
  `[Nummer]. [Akteurskürzel] [präzise, beobachtbare Aktion]`.
* Keine `if/else`-Verzweigungen im Happy Path!

</div>

</div>
<div class="col">

<div class="col-card">

#### Schrittfolge bei Ada's Expresslieferung:
1. `Kd` wählt Pflanze und klickt auf Express-Lieferung.
2. `Sys` prüft Lagerbestand und Kurierverfügbarkeit in Echtzeit.
3. `Sys` berechnet Gesamtpreis inkl. 5,90 € Expresszuschlag.
4. `Kd` bestätigt Gesamtsumme und autorisiert Kreditkartenzahlung.
5. `Sys` bucht Betrag ab und reserviert Pflanzenbestand im Lager.
6. `Sys` übermittelt Abholauftrag an `Ku`.
7. `Ku` bestätigt Annahme des Fahrauftrags innerhalb von 3 Minuten.
8. `Sys` generiert Tracking-Link und sendet Benachrichtigung an `Kd`.

</div>

</div>
</div>

---

### Szenariotabelle: Felder 8 & 9 (Alternative Pfade & Fehler)

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Feld 8: Alternative Pfade (Extensions)
* **Zweck:** Abweichende, aber **erfolgreiche** Abläufe.
* **Nummerierung:** Schrittnummer aus dem Happy Path + Buchstabe (`4a`, `7a`).

**Praxisbeispiel bei Ada:**
* **4a. B2B-Rechnungskauf:**  
  Ist `Kd` als B2B-Kunde verifiziert und Kreditlimit ausreichend ⇒ Schritte 4 & 5 erfolgen ohne Kreditkarte; Zahlungsziel 14 Tage auf Rechnung.
* **7a. Kurierverzögerung:**  
  Bestätigt `Ku` nicht in 3 Min ⇒ `Sys` delegiert Auftrag automatisch an den nächsten verfügbaren Kurier.

</div>

</div>
<div class="col">

<div class="col-card">

#### Feld 9: Fehlersituationen / Ausnahmen
* **Zweck:** Was passiert bei Abbrüchen, ungültigen Daten oder Systemausfällen?
* **Wichtig:** Wie räumt das System auf (Rollback von Reservierungen)?

**Praxisbeispiel bei Ada:**
* **2a. Artikel vergriffen:**  
  Bestand < 1 ⇒ `Sys` bricht Express-Ablauf ab und bietet Standardversand aus Zentrallager an.
* **4b. Zahlung abgelehnt:**  
  Karte ungültig ⇒ `Sys` fordert neue Zahlungsart; Bestandsreservierung verfällt nach 10 Minuten.

</div>

</div>
</div>

### Agile Spezifikation: User Stories & BDD

<div class="two-cols">
<div class="col">

In agilen Teams (Scrum/Kanban) werden Anforderungen als **User Stories** formuliert:

> **Als** `[Rolle / Akteur]`  
> **möchte ich** `[Ziel / Funktionalität]`,  
> **damit** `[fachlicher Nutzen / Mehrwert]`.

* Fördert das Verständnis: Entwickler verstehen **warum** ein Feature gebaut wird!
* Eine User Story wird erst durch messbare **Akzeptanzkriterien** überprüfbar.
* **BDD (Behavior-Driven Development):** Schreibt Akzeptanztests in lesbarer Gherkin-Syntax.

</div>
<div class="col">

```gherkin
Feature: B2B Express-Kauf auf Rechnung
  Als verifizierter B2B-Kunde von Ada
  Möchte ich Pflanzen per Express auf Rechnung bestellen
  Damit die Bürobegrünung ohne Kreditkartenabrechnung ankommt

  Scenario: Erfolgreicher Kauf bei ausreichendem Kreditlimit
    Given Kunde "GreenOffice GmbH" ist als B2B verifiziert
    And das verbleibende Kreditlimit beträgt 1.000 €
    When der Kunde Pflanzen im Wert von 350 € per Express bestellt
    Then wird die Bestellung sofort bestätigt
    And das neue Kreditlimit beträgt 650 €
    And ein Kurier wird innerhalb von 2 Stunden beauftragt

  Scenario: Ablehnung bei Überschreitung des Limits
    Given Kunde "StartUp AG" hat ein Restkreditlimit von 50 €
    When der Kunde Pflanzen im Wert von 120 € bestellen will
    Then wird der Rechnungskauf abgewiesen
    And eine Sofortzahlung (Kreditkarte/PayPal) gefordert
```

</div>
</div>

### BDD & Gherkin: Syntax & Warum es unverzichtbar ist

<div class="two-cols">
<div class="col">

#### Die kanonische Gherkin-Struktur:
Gherkin folgt dem Dreischritt **Given – When – Then**:

* **`Given` (Gegeben sei... / Ausgangslage):**  
  Beschreibt den Zustand und die Vorbedingungen des Systems, bevor die Aktion startet (z. B. *"Kunde ist verifiziert, Kreditlimit beträgt 1.000 €"*).
* **`When` (Wenn... / Aktion):**  
  Das auslösende Ereignis oder die Benutzerinteraktion (z. B. *"Kunde bestellt Pflanzen im Wert von 350 €"*).
* **`Then` (Dann... / Erwartetes Ergebnis):**  
  Das beobachtbare, überprüfbare Resultat (z. B. *"Bestellung wird bestätigt, neues Limit ist 650 €"*).
* **`And` / `But`:**  
  Verbindet logisch weitere Vor- oder Nachbedingungen.

</div>
<div class="col">

<div class="col-card">

#### Warum ist BDD & Gherkin so wertvoll?
1. **Gemeinsame Sprache (Ubiquitous Language):**  
   Schließt die Kluft zwischen Fachexperten (Ada), Product Ownern, Entwicklern und Testern – ganz ohne technischen Jargon.
2. **Ausführbare Spezifikation (Executable Specs):**  
   Mit Frameworks (`pytest-bdd`, `behave`, `Cucumber`) wird genau dieser Text **automatisiert als Testsuite ausgeführt**!
3. **Living Documentation:**  
   Die Dokumentation verstaubt nicht in PDFs: Ändert sich das Geschäftsverhalten, schlägt der Test in CI/CD fehl.
4. **Klärt Randfälle vor dem Coden:**  
   Zwingt das Team dazu, negative Pfade (*"Was passiert bei 0 € Limit?"*) vor der ersten Codezeile festzulegen.

</div>

</div>
</div>

### Defensive UI: Fehler im Keim ersticken

<div class="two-cols">
<div class="col">

<div class="col-card">

> *"Gutes Softwaredesign macht Fehlbedienung durch den Anwender unmöglich!"*

#### Defensive UI-Prinzipien im Pflichtenheft:
* **Deaktivieren statt Fehlermeldung:**  
  Ist eine Pflanze ausverkauft oder die Distanz zu groß, wird der Express-Button **ausgegraut / disabled**. Der Anwender kann gar nicht erst in den Fehlerzustand geraten!
* **Sofortige Inline-Validierung:**  
  Postleitzahlen und Lieferadressen werden direkt bei der Eingabe geprüft (z. B. *"Außerhalb unseres 15-km-Liefergebiets"*), nicht erst nach Absenden des gesamten Formulars.
* **Rollenbasierte Sichten:**  
  Ein Verkäufer an der Kasse sieht keine B2B-Kreditlimits; ein B2B-Kunde sieht sofort seine Netto-Preise und das verfügbare Kreditlimit.

</div>

</div>
<div class="col">

<div class="col-card">

#### Pflichtbestandteile der UI-Spezifikation:
1. **Mockup / Wireframe:** Visuelle Skizze der Oberfläche mit allen Zuständen.
2. **Feldtabelle:** Name, Datentyp, Pflichtfeld (Ja/Nein), Validierungsregel.
3. **Zustandsmatrix:** Wann ist welches Element aktiv (`enabled`), inaktiv (`disabled`) oder unsichtbar (`hidden`)?

**Zustandsmatrix für Ada's Express-Kauf:**
* `Bestand > 0 && Distanz ≤ 15 km` ⇒ Button `[Express (2h)]` aktiv.
* `Bestand == 0` ⇒ Button deaktiviert + Badge: *"Ausverkauft"*.
* `Distanz > 15 km` ⇒ Express deaktiviert + Inline-Hinweis.

</div>

</div>
</div>

### Bounded Contexts (Domain-Driven Design)

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

Warum scheitert die Idee einer einzigen, riesigen `Pflanze`-Klasse für das gesamte Unternehmen?

* **Im Webshop (Verkauf):**  
  Wichtig sind: Hochauflösendes Foto, emotionaler Marketingtext, Rabattstaffeln, Kundenbewertungen.
* **Im Lager (Inventory):**  
  Wichtig sind: Barcode, Regal- und Fachnummer, Mindestbestand, Lieferantennummer.
* **In der Logistik (Kurier):**  
  Wichtig sind: Gewicht in kg, Abmessungen in cm, Empfindlichkeit gegen Frost/Kippen.

> Ein **Bounded Context** definiert eine klare Grenze, innerhalb derer ein fachliches Modell und eine einheitliche Sprache (**Ubiquitous Language**) uneingeschränkt gelten!

</div>

</div>

        L1[Lagerplatz] --> L2[Bestand]
    end
    subgraph Logistik["Context: Auslieferung"]
        D1[Paket-Masse] --> D2[Kurier-Route]
    end

### Der Übergang: Vom Problemraum (OOA) zum Lösungsraum (OOD)

<div class="two-cols">
<div class="col">

Nachdem wir Akteure, Use Cases, Szenarien und Bounded Contexts analysiert haben, stehen viele Entwickler vor der Frage:  
**Wie fange ich jetzt an zu programmieren?**

#### 1. Die OOA beschreibt den Problemraum:
* **Fokus:** Das **"WAS"** (Fachdomäne, Fachbegriffe, Geschäftsregeln).
* **Zielgruppe:** Kunde, Fachexperten, Anwender.
* **Sprache:** Reine Domänensprache (z. B. "Pflanze", "Kreditlimit", "Kurier").
* **Technik:** Völlig frei von Implementierungsdetails (kein SQL, kein JSON, kein Python)!

</div>
<div class="col">

<div class="col-card">

#### 2. Das OOD entwirft den Lösungsraum:
* **Fokus:** Das **"WIE"** (Softwarearchitektur, Klassen, Schnittstellen, Datenstrukturen).
* **Zielgruppe:** Entwickler, Architekten, Tester.
* **Sprache:** Technische Spezifikation (z. B. `OrderService`, `PostgresRepository`, `JWT`, `REST`).
* **Zuweisung von Verantwortung (Responsibility-Driven Design):**  
  Welche Klasse speichert die Daten? Welche führt die Geschäftslogik aus? Welche kommuniziert mit der Außenwelt?

</div>

</div>
</div>

### Die Abbott-Methode (Substantiv-Verb-Analyse)

<div class="two-cols">
<div class="col">

Eine bewährte, intuitive Technik von Russell J. Abbott (1983) zur systematischen Ableitung von Objektmodellen aus Anforderungstexten und Szenariotabellen:

#### Die grammatikalische Übersetzungsmatrix:
* **Substantive (Nomen) → Klassen oder Attribute:**  
  * Eigenständige Dinge/Konzepte → **Klassen** (`Kunde`, `Bestellung`, `Pflanze`).
  * Einfache Werte/Eigenschaften → **Attribute** (`preis`, `adresse`, `email`).
* **Vollverben → Methoden & Operationen:**  
  Aktionen, Berechnungen oder Statusänderungen (`bezahlen()`, `reservieren()`).
* **Haben-Verben ("besitzt", "enthält") → Assoziation / Komposition:**  
  Beziehungen zwischen Objekten (`Warenkorb` *enthält* `Positionen`).
* **Sein-Verben ("ist ein") → Vererbung / Generalisierung:**  
  Klassenhierarchien (`Zimmerpflanze` *ist eine* `Pflanze`).
* **Adjektive → Attribute, Flags oder Enums:**  
  Zustände oder Ausprägungen (`is_express: bool`, `status: StatusEnum`).

</div>
<div class="col">

<div class="col-card">

#### Grundbeispiel: Webshop-Bestellung
> *"Der **Kunde** wählt eine **Pflanze** aus und legt sie in den **Warenkorb**. Er **bezahlt** die **Bestellung** mit einer **Kreditkarte**. Das System **reserviert** den **Bestand** und **beauftragt** einen **Kurier**."*

#### Ableitung in den Entwurf:
* **Klassen & Entitäten:**  
  `Kunde`, `Pflanze`, `Warenkorb`, `Bestellung`, `Kreditkarte`, `Kurier`.
* **Methoden & Verantwortlichkeiten:**  
  * `Warenkorb.fuege_hinzu(pflanze, menge)`
  * `ZahlungsService.buche_ab(karte, betrag)`
  * `LagerService.reserviere_bestand(pflanze, menge)`
  * `KurierService.erstelle_auftrag(adresse)`

</div>

</div>
</div>

### Abbott-Methode in der Praxis: 3 weitere Fallbeispiele bei Ada

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Beispiel 1: Ladenkasse (POS-Verkauf)
> *"Der **Verkäufer** **scannt** den **Barcode** der Pflanze. Die **Kasse** **berechnet** den **Gesamtbetrag**, **verbucht** die **Barzahlung** und **druckt** den **Kassenbon**."*

* **Klassen & Attribute:**  
  * `Kasse`, `Kassenbon` (Klassen)
  * `barcode: str`, `gesamtbetrag: float` (Attribute)
* **Methoden:**  
  * `Kasse.scanne_artikel(barcode)`
  * `Kasse.berechne_summe()`
  * `Kasse.buche_barzahlung(betrag)`
  * `BonDrucker.drucke(kassenbon)`

</div>

<div class="col-card" style="margin-top: 12px;">

#### Beispiel 2: B2B-Kauf auf Rechnung
> *"Ein **B2B-Kunde** **besitzt** ein **Kreditlimit**. Wenn er auf Rechnung **bestellt**, **prüft** das System die **Deckung** und **reduziert** das Limit."*

* **Haben-Beziehung:** `B2BKunde` hat Attribut `kreditlimit: float`.
* **Methoden:** `Kunde.bestelle_auf_rechnung()`, `KreditPruefer.pruefe_deckung()`.

</div>

</div>
<div class="col">

<div class="col-card">

#### Beispiel 3: IoT-Pflanzenpflege & Lager
> *"Ein **BodenSensor** **misst** stündlich die **Bodenfeuchte** einer Topfpflanze. Wenn der Wert den **Grenzwert** **unterschreitet**, **alarmiert** das System den Gärtner."*

* **Klassen & Entitäten:**  
  * `BodenSensor`, `TopfPflanze`, `AlarmNotification`
* **Attribute & Werte:**  
  * `feuchte_prozent: float`, `min_grenzwert: float`
* **Methoden & Logik:**  
  * `BodenSensor.lese_feuchte() -> float`
  * `PflanzenMonitor.pruefe_grenzwert(sensor, wert)`
  * `AlertService.sende_giess_alarm(gaertner_id)`

#### Didaktischer Praxistipp:
Nicht jedes Nomen wird eine Klasse! Unterscheide stets:
* Ist es ein **eigenständiger Begriff mit Verhalten**? → Klasse!
* Ist es nur eine **messbare Eigenschaft**? → Attribut!

</div>

</div>
</div>

### Responsibility-Driven Design: Vom Szenarioschritt zur Methode

<div class="two-cols-wide-left">
<div class="col">

<div class="col-card">

#### Das Leitprinzip: Information Expert (GRASP)
* **Die zentrale Entwurfsfrage:**  
  *Welche Klasse soll eine bestimmte Methode / Verantwortung erhalten?*
* **Die goldene Regel:**  
  Weise die Verantwortung der Klasse zu, die über die **notwendigen Daten verfügt**, um sie zu erfüllen!

#### Ableitung aus Schritt 2 der Szenariotabelle:
> *"Schritt 2: Das System prüft das Kreditlimit des B2B-Kunden..."*

* **Falscher Entwurf (Anfängerfalle):**  
  Eine externe Klasse holt mit Gettern alle Zahlen und rechnet selbst:  
  `if kunde.get_limit() - kunde.get_verbrauch() >= preis: ...`  
  ❌ Zerstört Datenkapselung (*Feature Envy*)!
* **Richtiger Entwurf (Information Expert):**  
  `B2BKunde` kennt sein eigenes Limit und prüft selbst:  
  `kunde.hat_ausreichend_deckung(preis) -> bool`  
  ✅ Perfekte Kapselung von Zustand und Verhalten!

</div>

</div>
<div class="col">

<div class="col-card">

#### Koordination durch Application Services:
* Eine Fach-Entität (`B2BKunde`) verwaltet nur ihre **eigenen Daten**.
* Wer steuert aber den **Gesamtablauf** über mehrere Entitäten hinweg (Kunde, Warenkorb, Lager, Kurier)?
* **Die Antwort:** Ein **Application Service** (`BestellAbwicklungService`).

```mermaid
flowchart TD
    Service["BestellAbwicklungService<br><i>(Koordinator / Use Case)</i>"]
    Kunde["B2BKunde<br><i>(Information Expert: Limit)</i>"]
    Lager["Lagerbestand<br><i>(Information Expert: Stückzahl)</i>"]
    
    Service -->|1. hat_deckung?| Kunde
    Service -->|2. reserviere_bestand()| Lager
```

* Der Service besitzt **keinen eigenen Zustand**, sondern orchestriert die Fachklassen!

</div>

</div>
</div>

### Das Domänenmodell für Ada: Klassen & Beziehungen im UML-Diagramm

<div class="two-cols-wide-left">
<div class="col">

```mermaid
classDiagram
    class BestellAbwicklungService {
        +fuehreBestellungAus(kunde, warenkorb) OrderResult
    }

    class Kunde {
        +kunde_id : String
        +name : String
        +email : String
    }

    class B2BKunde {
        -kreditlimit : float
        -verbrauchtes_limit : float
        +hat_ausreichend_deckung(betrag : float) bool
        +belaste_limit(betrag : float)
    }

    class Bestellung {
        +bestell_nr : String
        +datum : DateTime
        +status : BestellStatus
        +berechne_gesamtsumme() float
    }

    class BestellPosition {
        +menge : int
        +einzelpreis : float
        +berechne_zeilensumme() float
    }

    class Pflanze {
        +art_id : String
        +botanischer_name : String
        +katalog_preis : float
    }

    Kunde <|-- B2BKunde : ist ein
    BestellAbwicklungService --> Kunde : bedient
    BestellAbwicklungService --> Bestellung : erzeugt
    Bestellung "1" *-- "1..*" BestellPosition : besitzt existenziell
    BestellPosition --> Pflanze : referenziert
```

</div>
<div class="col">

<div class="col-card">

#### Die Struktur des Analyse-Entwurfs:
1. **Klare Rollenverteilung:**
   * `Kunde` und `B2BKunde` kapseln Stammdaten und Kreditwürdigkeit.
   * `Bestellung` und `BestellPosition` bilden eine **Komposition** (Positionen existieren nie ohne Bestellung).
   * `Pflanze` ist die geteilte Referenz im Katalog.
2. **Orchestrierung:**
   * `BestellAbwicklungService` realisiert genau den Use Case *"Bestellung aufgeben"*.
3. **Konzeptionelle Reinheit:**
   * Dieses Diagramm ist **100 % technologie-unabhängig**: Kein SQL, kein ORM, keine HTTP-Header.

> **Das ist das fertige Analysemodell!**

</div>

</div>
</div>

### Die kanonische OOA-zu-OOD-Übergangsmatrix

<div class="two-cols" style="grid-template-columns: 1.35fr 0.85fr; gap: 20px;">
<div class="col" style="font-size: 0.72em;">

Die folgende Matrix dient als **Leitfaden für den gesamten Übergang** von den Analyse-Ergebnissen zur technischen Architektur:

| OOA-Artefakt (Analyse) | OOD-Artefakt (Design) | Konkretes Beispiel bei Ada |
| :--- | :--- | :--- |
| **Akteur** | Client, Auth-Rolle, API-Consumer | `Verkaeufer` → POS-App / JWT-Rolle |
| **Use Case** | Application Service / Interactor | `Bestellung aufgeben` → `OrderService` |
| **Szenario-Schritt** | Methodenaufruf, Transaktion | Schritt 2 → `payment.charge()` |
| **Vorbedingung** | Guard Clause / Validator | `Kunde verifiziert` → `if not user.is_active` |
| **Nachbedingung** | Assertions, DB-Commit | `Bestand reserviert` → SQL `COMMIT` |
| **Fehlerpfad** | Exception, Error-Response | `Limit überschritten` → `400 Bad Request` |
| **Bounded Context** | Modul, Package, Microservice | `Lager vs. Webshop` → getrennte Pakete |

</div>
<div class="col">

<div class="col-card">

#### Die 3 goldenen Regeln für den Übergang:
1. **Kein Code ohne Analyse:** Wer ohne Szenariotabelle programmiert, vergisst 80 % der Fehlerfälle und Randbedingungen.
2. **Klassen spiegeln die Domäne wider:** Namen im Code müssen den Begriffen entsprechen, die Chefin Ada im Laden verwendet (*Ubiquitous Language*).
3. **Klare Schnittstellen:** Services kommunizieren über definierte Interfaces, nicht über globale Variablen oder geteilten Speicher.

</div>

</div>
</div>

### Zusammenfassung Modul 2

<div class="two-cols">
<div class="col">

1. **OOA klärt das "WAS":** Verhindert das teure Bauen falscher Software durch sauberes Anforderungsmanagement.
2. **Lastenheft vs. Pflichtenheft:** Der Kunde beschreibt den fachlichen Wunsch, das Entwicklerteam die verbindliche technische Lösung.
3. **Akteure sind Rollen:** Sie stehen außerhalb des Systems (Menschen oder Fremdsysteme).
4. **Use Cases sind Blackboxen:** Formuliert im Aktiv (`[Substantiv] + [Verb]`).

</div>
<div class="col">

5. **`<<include>>` ist Pflicht, `<<extend>>` die Kür:** Include läuft immer mit, Extend nur unter Bedingungen am Extension Point.
6. **Die Szenariotabelle ist das Herzstück:** 9 kanonische Felder; der Happy Path allein reicht für die Praxis niemals aus!
7. **User Stories & BDD:** Schlagen die Brücke zur agilen Entwicklung mit testbaren Gherkin-Szenarien.
8. **Bounded Contexts (DDD):** Jedes Modul hat sein eigenes, schlankes Datenmodell.

</div>
</div>

### Denkpause & Reflexionsfragen

<div class="two-cols">
<div class="col">

<div class="col-card">

#### Frage 1: Include oder Extend?
* Anwendungsfall A: "Im Restaurant essen" und "Rechnung bezahlen".
* Anwendungsfall B: "Kaffee bestellen" und "Hafermilch statt Kuhmilch wählen".  
Welche Beziehung (`<<include>>` oder `<<extend>>`) liegt jeweils vor und in welche Richtung zeigt der Pfeil?

</div>

<div class="col-card" style="margin-top: 15px;">

#### Frage 2: Use-Case-Formulierung
Welcher der folgenden Namen ist ein valider Use Case nach OOA-Kriterien?  
a) `PasswortHashBerechnen`  
b) `GutscheinEinloesen`  
c) `DatenbankTabelleErstellen`

</div>

</div>
<div class="col">

<div class="col-card">

#### Antworten zur Selbstkontrolle:
1. **Fall A:** `<<include>>` (Essen schließt Bezahlen zwingend ein; Pfeil von Essen → Bezahlen).  
   **Fall B:** `<<extend>>` (Hafermilch ist optional; Pfeil von Hafermilch → Kaffee bestellen).
2. **Nur b) `GutscheinEinloesen`** ist ein echter Use Case!  
   * a) und c) sind rein interne technische Einzelschritte ohne eigenständigen geschäftlichen Kundennutzen.

</div>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'neutral',
            fontFamily: '"Inter", system-ui, sans-serif'
        });
        async function renderSlideMermaid(slide) {
            if (!slide) return;
            // 1. Convert any code containing mermaid class to div.mermaid
            slide.querySelectorAll('code[class*="mermaid"]').forEach((el) => {
                const pre = el.closest('pre');
                if (pre) {
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    let text = el.textContent || '';
                    text = text.replace(/--&gt;/g, '-->')
                               .replace(/&gt;/g, '>')
                               .replace(/&lt;/g, '<')
                               .replace(/&amp;/g, '&')
                               .replace(/&quot;/g, '"');
                    div.textContent = text.trim();
                    pre.replaceWith(div);
                }
            });

            // 2. Also clean up any div.mermaid written directly in HTML
            slide.querySelectorAll('.mermaid:not([data-processed="true"])').forEach((el) => {
                let text = el.textContent || '';
                text = text.replace(/--&gt;/g, '-->')
                           .replace(/&gt;/g, '>')
                           .replace(/&lt;/g, '<')
                           .replace(/&amp;/g, '&')
                           .replace(/&quot;/g, '"');
                el.textContent = text.trim();
            });

            // 3. Render all unrendered div.mermaid in this active slide
            const nodes = slide.querySelectorAll('.mermaid:not([data-processed="true"])');
            if (nodes.length > 0) {
                try {
                    await mermaid.run({ nodes: nodes, suppressErrors: false });
                } catch (err) {
                    console.error('Mermaid run error:', err);
                }
            }
        }

        Reveal.initialize({
            width: 1280,
            height: 720,
            margin: 0.05,
            minScale: 0.2,
            maxScale: 2.0,
            hash: true,
            slideNumber: 'c/t',
            transition: 'slide',
            plugins: [ RevealMarkdown, RevealHighlight ]
        }).then(() => {
            renderSlideMermaid(Reveal.getCurrentSlide());
        });

        Reveal.on('slidechanged', (event) => {
            renderSlideMermaid(event.currentSlide);
        });
    </script>
